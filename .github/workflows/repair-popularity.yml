name: Repair Popularity (壊れた人気・調教師・馬体重を再取得で復旧)

# 2026-07-04 以降の結果ページ列崩れ（2026-08-03②③で発見・修正）で取得できなく
# なった popularity / trainer / body_weight を、修正後のパーサーで取り直して
# history.db の既存行を埋め直す。
#
# なぜ急ぐか: popularity は取得失敗時に NULL ではなく 99（不明のセンチネル）で
# 保存され、engine.py が 99 を NaN に落とすため、**残差学習モデルの base_margin
# （市場アンカー）が完全に死ぬ**。実測（2026-08-05, walk-forward N=28,247）:
#
#     アンカー健全な行  N=20,952  AUC 0.8207
#     アンカー死亡行    N= 7,295  AUC 0.7091   ← 差 -0.11
#
# しかも本番モデル(PR #143)の検証窓 2026-06-06〜08-02 は 58% がアンカー死亡
# 状態だった。つまり現行モデルの採用根拠自体が壊れたデータの上にある。
#
# ⚠ 前提: src/utils/db.py の save_history_db() 側の修正（UPDATE節に
#    popularity/trainer を追加、popularity は 1〜98 の時だけ上書き）が
#    入っていること。これが無いと再取得しても既存行は直らない。
#
# ⚠ 遅い。1開催日あたり数分かかる（R01 の suffix 探索が大半）。
#    1回で終わらない場合は同じワークフローをもう一度実行すれば続きから進む
#    （復旧済みの日は自動でスキップされる）。
#
# ⚠ JRAの結果一覧ページは直近ぶんしか載っていないため、**古い開催日は
#    取り直せない可能性が高い**（2026-08-03の配当埋め戻しで「2026-06-06より
#    前に行けない」と実測済み）。そのため既定は新しい順に処理する。
#
# ⚠ concurrency は予想・結果取得と同じ 'keiba-weekly'。開催日以外に実行すること。

on:
  workflow_dispatch:
    inputs:
      budget:
        description: '1回で処理する開催日の上限'
        required: false
        default: '10'
        type: string
      max_minutes:
        description: '1回の時間上限（分）。先に来たほうで打ち切る'
        required: false
        default: '120'
        type: string
      oldest_first:
        description: '古い開催日から処理する（既定は新しい順＝取得できる可能性が高い順）'
        required: false
        default: false
        type: boolean
      dry_run:
        description: '対象日を表示するだけ（取得しない）'
        required: false
        default: false
        type: boolean

concurrency:
  group: keiba-weekly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download history.db via LFS
        run: git lfs pull --include="data/history.db"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: python scripts/repair_popularity.py --dry-run --budget "${{ inputs.budget }}"

      # 25分ごとに区切って**その都度push**する。一度にまとめてpushする設計だと
      # 途中でジョブが落ちた時にそれまでの成果が丸ごと失われる（ランナーは破棄される）。
      - name: Repair (25分ごとにpushしながら繰り返す)
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_LFS_SKIP_SMUDGE=1

          CHUNK=25
          TOTAL="${{ inputs.max_minutes }}"
          BUDGET="${{ inputs.budget }}"
          DEADLINE=$(( $(date +%s) + TOTAL * 60 ))

          push_now() {
            if git diff --quiet -- data/history.db; then
              echo "  （新たに復旧した行なし）"
              return 0
            fi
            BACKUP=$(mktemp -d)
            cp data/history.db "$BACKUP/history.db"
            for i in 1 2 3 4 5; do
              git fetch origin main
              git reset --hard origin/main
              cp "$BACKUP/history.db" data/history.db
              git add data/history.db
              if git diff --cached --quiet; then
                echo "  （既に反映済み）"
                return 0
              fi
              git commit -m "auto: repair popularity/trainer $(date +%Y%m%d-%H%M)"
              if git push; then
                echo "  ⬆ pushしました"
                return 0
              fi
              echo "  ⚠ push失敗、mainの最新を取り直してリトライ ($i/5)"
              sleep $((i * 5))
            done
            echo "::error::5回リトライしてもpushできませんでした"
            return 1
          }

          ROUND=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            ROUND=$((ROUND + 1))
            REMAIN_MIN=$(( (DEADLINE - $(date +%s)) / 60 ))
            [ "$REMAIN_MIN" -lt 6 ] && break
            [ "$REMAIN_MIN" -lt "$CHUNK" ] && CHUNK="$REMAIN_MIN"
            echo "===== 第${ROUND}回（残り約${REMAIN_MIN}分） ====="

            # tee を通すとパイプラインの終了状態が tee のものになるため
            # PIPESTATUS で本体の終了状態を見る。
            set +e
            python scripts/repair_popularity.py \
              --budget "$BUDGET" --max-minutes "$CHUNK" \
              ${{ inputs.oldest_first && '--oldest-first' || '' }} | tee /tmp/rp.out
            RC=${PIPESTATUS[0]}
            set -e

            # 復旧できたぶんは先にpushしてから終了判定する（成果を捨てない）
            push_now || exit 1

            if [ "$RC" -ne 0 ]; then
              echo "::error::repair_popularity.py が異常終了しました (exit $RC)"
              exit "$RC"
            fi

            if grep -q "復旧が必要な開催日はない" /tmp/rp.out; then
              echo "✅ すべて復旧しました"
              break
            fi
            # 1日も進まなかった＝取り直せない日ばかりなので止める
            if grep -q "完了: 0日" /tmp/rp.out; then
              echo "⚠ このラウンドで1日も復旧できなかったので終了する"
              echo "   （JRAの結果一覧に載っていない古い開催日の可能性が高い）"
              break
            fi
          done

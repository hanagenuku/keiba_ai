name: Collect Odds Timeseries

# オッズ時系列の収集（設計書 Phase 0 → B「リアルタイム収集」）。
#
# ■ なぜ長時間ジョブ + 内部ループなのか
#   GitHub Actions の cron は5分粒度で、実際には5〜20分遅延する。
#   「発走30分前」を揃えたいのに cron のジッタがそのまま誤差になるため、
#   1本のジョブを走らせ内部で時刻を見て poll する。公開リポジトリなので
#   Actions 分数は無料。
#
# ■ 収集は取り返しがつかない
#   オッズページは発走前しか存在せず、過去に遡れない（2026-08-17確認）。
#   結果ページからオッズ列も消滅済み（2026-08-03③）。
#   つまり**ここで取らなかったものは永久に手に入らない**。
#   そのため粒度は粗くせず（後で間引けるが細かくはできない）、
#   発走直前まで取る（最終オッズの唯一の入手経路）。
#
# ■ 🔴 keiba.db には触らない
#   このジョブは 09:20〜14:50 JST 走るが、その間に weekend.yml の refresh が
#   11:30 / 14:00 に走り同じ data/keiba.db を push する。ジョブ開始時の
#   keiba.db を最後に上書き push すると、その間の race_predictions /
#   prediction_snapshots が黙って消える（バイナリなのでgitがマージできない）。
#   → 収集は data/odds_ts/*.jsonl（このジョブだけが書く追記ファイル）に落とし、
#     keiba.db への取り込みは sunday-results.yml で行う。
#   テキストなので途中で何度でも push でき、5.5時間ぶんを最後に1回だけ
#   push する危うさも同時に消える（2026-07-18のタイムアウト事故と同型）。

on:
  workflow_dispatch:
    inputs:
      date:
        description: '収集する開催日 YYYYMMDD（省略時は当日）'
        required: false
        type: string
      max_minutes:
        description: '最大実行時間（分）'
        required: false
        default: '330'
        type: string
      interval_sec:
        description: 'poll間隔（秒）'
        required: false
        default: '120'
        type: string
  schedule:
    # 土日 09:20 JST（00:20 UTC）開始。1本で5.5時間カバーする。
    - cron: '20 0 * * 6,0'
    # 15:00 JST（06:00 UTC）から2本目。最終レースまでを拾う。
    - cron: '0 6 * * 6,0'

permissions:
  contents: write

concurrency:
  group: keiba-odds-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # スクリプト側の上限(330分)より必ず長くする
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect
        run: |
          MIN="${{ inputs.max_minutes }}"; MIN="${MIN:-330}"
          # ジョブのtimeout(350)より必ず短くする
          if [ "$MIN" -gt 330 ]; then MIN=330; fi
          IVL="${{ inputs.interval_sec }}"; IVL="${IVL:-120}"
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="--date ${{ inputs.date }}"; fi
          git config user.email "bot@keiba_ai"
          git config user.name "keiba_ai bot"
          # 🔴 収集先は作業ツリーの外。git reset --hard が収集中のファイルを
          #    巻き戻して直前の行を失う事故を構造的に防ぐ。
          STAGE="${RUNNER_TEMP:-/tmp}/odds_ts"
          mkdir -p "$STAGE"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          # 20分ごとに data/odds_ts/ だけを push する見張り。
          # 収集は取り返しがつかない（発走前にしか存在しない）ので、
          # ジョブが落ちてもそこまでの分は残るようにする。
          (
            while true; do
              sleep 1200
              ls "$STAGE"/*.jsonl >/dev/null 2>&1 || continue
              for i in 1 2 3; do
                git fetch -q origin main && git reset -q --hard origin/main
                mkdir -p data/odds_ts && cp "$STAGE"/*.jsonl data/odds_ts/
                git add data/odds_ts/ || true
                git diff --cached --quiet && break
                git commit -q -m "data: オッズ時系列を収集 (中間 $(date -u +%H:%M))"
                git push -q origin HEAD:main && break
                sleep $((i * 5))
              done
            done
          ) &
          PUSHER=$!
          python scripts/collect_odds.py --base-dir . --out-dir "$STAGE" \
            --max-minutes "$MIN" --interval-sec "$IVL" $ARGS
          kill $PUSHER 2>/dev/null || true

      - name: Commit & Push
        run: |
          # 🔴 data/odds_ts/ だけを push する。data/keiba.db は触らない
          #    （並行する weekend.yml の refresh を上書きしてしまうため）。
          #    収集の実体は $STAGE（作業ツリー外）にあるので、resetしても失われない。
          STAGE="${STAGE:-${RUNNER_TEMP:-/tmp}/odds_ts}"
          if ! ls "$STAGE"/*.jsonl >/dev/null 2>&1; then
            echo "収集ファイルなし"; exit 0
          fi
          git config user.email "bot@keiba_ai"
          git config user.name "keiba_ai bot"
          for i in 1 2 3 4 5; do
            git fetch origin main && git reset --hard origin/main
            mkdir -p data/odds_ts && cp "$STAGE"/*.jsonl data/odds_ts/
            git add data/odds_ts/ || true
            if git diff --cached --quiet; then echo "差分なし"; exit 0; fi
            git commit -m "data: オッズ時系列を収集 ($(date -u +%Y-%m-%d))"
            if git push origin HEAD:main; then echo "push成功"; exit 0; fi
            echo "push失敗 リトライ $i"; sleep $((i * 5))
          done
          echo "🔴 5回試してpushできなかった"; exit 1

name: Monthly Model Retrain

on:
  # ⚠ 自動実行は 2026-08-03 に停止した（手動実行は従来どおり可能）。
  #
  # 理由: このジョブは GitHub 側の history.db だけで学習するが、それは
  # 2026-07-14 に始まった浅い系統で 5,457レース / 75,126行しかない。
  # Colab（Drive側）は 11,554レース / 158,775行あり、**2倍以上の差**がある。
  # そのため本番より良いモデルを作れる見込みが構造的に無い。
  #   実測 2026-08-01: GitHub側 AUC 0.7194 / Colab側 0.7452（朝人気評価 0.7530）
  #
  # AUC_THRESHOLD=0.75 はリーク除去前・非残差モデル（約0.80）を前提に決めた
  # 値で、リーク除去後は Colab でも届かない。放置すると毎月必ず失敗通知が出る。
  # かといって閾値を下げると、**半分のデータで作ったモデルが本番を上書きする**。
  # どちらも望ましくないので、自動昇格そのものを止める。
  #
  # 再開する前提条件（両方満たすこと）:
  #   1. GitHub 側の history.db に Drive 側の全履歴を反映する
  #      （Colab から data/history.db を push すれば解消する）
  #   2. 閾値をリーク除去後の実測から引き直す（0.75 は過去の遺物）
  #
  # 現在の運用: 再学習は KEIBA_XGB_retrain_v6.ipynb（Colab）が正。
  # schedule:
  #   - cron: '0 18 1 * *'  # 毎月1日 03:00 JST
  workflow_dispatch:

concurrency:
  group: keiba-weekly
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Download required files via LFS
        run: git lfs pull --include="data/*.db,data/*.pkl"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monthly retrain
        run: python scripts/monthly_retrain.py

      - name: Commit updated model
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 生成物を退避してから常にmain最新の上に上書きコミットする方式にする。
          # モデルファイルはバイナリでgitが自動マージできないため、旧来のpull --rebaseは
          # 実行中に他の変更がmainにpushされるとコンフリクトして失敗する既知の問題があった
          # （2026-07-24調査で判明、friday-predict等と同じ手口で修正）。
          BACKUP_DIR=$(mktemp -d)
          for f in data/xgb_fukusho_model.pkl data/xgb_calibrator.pkl \
                   data/xgb_feature_cols.json data/horse_features.csv; do
            [ -f "$f" ] && cp "$f" "$BACKUP_DIR/$(basename "$f")"
          done

          export GIT_LFS_SKIP_SMUDGE=1
          PUSHED=0
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for f in xgb_fukusho_model.pkl xgb_calibrator.pkl xgb_feature_cols.json horse_features.csv; do
              [ -f "$BACKUP_DIR/$f" ] && cp "$BACKUP_DIR/$f" "data/$f"
            done
            for f in data/xgb_fukusho_model.pkl data/xgb_calibrator.pkl \
                     data/xgb_feature_cols.json data/horse_features.csv; do
              [ -f "$f" ] && git add "$f"
            done
            if git diff --cached --quiet; then
              echo "変更なし（既に反映済み）"
              PUSHED=1
              break
            fi
            git commit -m "auto: monthly retrain $(date +%Y%m)"
            if git push; then
              PUSHED=1
              break
            fi
            echo "⚠ push失敗、mainの最新を取り直してリトライ ($i/5)"
            sleep $((i * 5))
          done
          if [ "$PUSHED" != "1" ]; then
            echo "::error::5回リトライしてもpushできませんでした"
            exit 1
          fi

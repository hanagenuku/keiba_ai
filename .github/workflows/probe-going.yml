name: Probe Going / Weather (診断)

# 出馬表ページに「馬場状態・天候」が載っているかを実データで確認する調査用。
#
# 背景（2026-08-27発見）:
#   結果ページ parse_result_soup は track_condition / weather を取っているが、
#   出馬表側 parse_header は取っていない。そのため推論時は
#       race.get('track_condition', '良') → 常に「良」
#   になり、f_track_cond が学習では実測値・推論では常に0.0 になっている。
#   良でないレースは全体の27.2%（稍重16.3 / 重7.8 / 不良3.2）。
#
# ⚠ 出馬表一覧(pw01dli00)は「これから開催されるレース」しか載せないため、
#   過去日を指定しても空振りする。金曜〜日曜に、これからの開催日を指定すること
#   （2026-08-17のワイドオッズ・プローブで同じ罠を2回踏んでいる）。

on:
  workflow_dispatch:
    inputs:
      date:
        description: '調べたい開催日 YYYYMMDD（これからの開催日を指定すること）'
        required: true
        type: string

# 読み取り専用であることを権限でも担保する（誤って push できないように）
permissions:
  contents: read

concurrency:
  group: keiba-weekly
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Probe
        run: python scripts/probe_going.py
        env:
          TARGET_DATE: ${{ inputs.date }}

      - name: 書き込みが無いことを確認
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "🔴 このプローブは読み取り専用のはずだが差分が出た"
            git status --porcelain
            exit 1
          fi
          echo "✅ 差分なし（読み取り専用を確認）"

name: Backfill shown bets (朝に出した買い目の埋め戻し・手動)

# scripts/backfill_morning_bets.py。data/latest.json の git 履歴から「朝の版」の
# アプリ買い目と記事の2コースを displayed_bets に入れて決済し、stats.json を作り直す。
# data/ のコミットは North Star #2 の例外（Actions の自動データコミット）。

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'この日以降の履歴を見る'
        default: '2026-07-25'
        type: string

concurrency:
  group: keiba-weekly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Download required files via LFS
        run: git lfs pull --include="data/*.db,data/*.pkl"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill
        env:
          SINCE: ${{ inputs.since }}
        run: python scripts/backfill_morning_bets.py --since "$SINCE"

      - name: Generate stats
        run: python scripts/generate_stats.py

      - name: Commit & Push (data/keiba.db・data/stats.json だけ)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BACKUP_DIR=$(mktemp -d)
          cp data/keiba.db data/stats.json "$BACKUP_DIR/"
          export GIT_LFS_SKIP_SMUDGE=1
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$BACKUP_DIR/keiba.db" "$BACKUP_DIR/stats.json" data/
            git add data/keiba.db
            git add data/stats.json
            if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
            git commit -m "auto: backfill shown bets $(date +%Y%m%d)"
            if git push; then exit 0; fi
            sleep $((i * 5))
          done
          echo "::error::push できませんでした"; exit 1

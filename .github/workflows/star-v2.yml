name: Star v2 measurement (☆の作り直しの測定・手動)

# 事前登録カード hitrate/CRITERIA_STAR_V2.md の測定を1回。web 列つきの学習データが要るのでランナーで作る。
# 🔴 本番のモデルには触らない。集計だけを `starv2/<run_id>` ブランチに置く。

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Download required files via LFS
        run: git lfs pull --include="data/*.db,data/*.pkl"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Find the run that has the index DB
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=web-signals-db&per_page=30" \
                  --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // ""')
          if [ -z "$RID" ]; then echo "::error::指数DBの artifact が無い"; exit 1; fi
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"

      - name: Restore index DB
        uses: actions/download-artifact@v4
        with:
          name: web-signals-db
          path: data/private
          run-id: ${{ steps.last.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Build training data
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from src.tools.build_training_data import build_training_data
          build_training_data('.')
          PY

      - name: Measure (1回)
        run: python3 hitrate/eval_star_v2.py

      - name: Push result to a branch (main には入れない)
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BR="starv2/${{ github.run_id }}"
          git checkout -b "$BR"
          git add hitrate/star_v2_result.json
          git commit -m "star v2: 測定結果（run ${{ github.run_id }}）"
          git push origin "$BR"

name: Probe Wide Odds (調査)

# ワイドのオッズ盤が JRA公式から取得できるかを実データで確認する。
# この環境（Claude Code）からは www.jra.go.jp へ到達できない（プロキシが403）ため、
# ネットワークが通る GitHub Actions 側で実HTMLを見て、その構造をログに残す。
# 2026-08-03③（結果ページの列崩れ）・2026-08-16（調教データ）と同じやり方。
#
# 目的:
#   1レースで3着内に入るのは必ず3頭 → Σ_B P(A,Bともに3着内) = 2×P(Aが3着内)
#   という厳密な恒等式で、ワイドのオッズ盤と複勝のオッズ盤を突き合わせたい。
#   正規化定数が既知なので控除率の推定が要らず、予測モデルも使わない。
#
# ⚠ 完全な読み取り専用。DB・モデル・latest.json には一切書き込まない。
# ⚠ リクエスト数: R01 suffix の総当たり（最大256件・本番の週次と同じ探索）
#    ＋ Step 1/2 の計測で 1レースあたり2件（単複盤とワイド盤）×最大12レース。
#    いずれも1秒待機。2026-09-12 に Step 0（到達）を通過したので、
#    以降は dprime/CRITERIA.md の Step 1（盤の健全性）→ Step 2（恒等式）を測る。

on:
  workflow_dispatch:
  schedule:
    # 🔴 オッズ盤は「発走前」にしか存在しない。出走表一覧(pw01dli00)も
    #    これから開催されるレースしか載せないため、月曜に走らせても
    #    「開催情報が見つかりません」で必ず空振りする（2026-08-17に実測）。
    #    そのため開催日の朝に自動で走らせる。土曜が何らかの理由で空振り
    #    しても日曜で拾えるよう、両日に撃つ（1回きりにしない）。
    #    23:10 UTC 金・土 = 08:10 JST 土・日
    #    （既存の weekend refresh 08:00 の直後）
    - cron: '10 23 * * 5,6'

permissions:
  contents: read

concurrency:
  group: keiba-weekly
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Probe
        run: python scripts/probe_wide_odds.py

name: Probe web sources (記事の作りの下見・手動)

# scripts/probe_web_source.py。結果はログだけ（本文は出さない）。何もコミットしない。

on:
  workflow_dispatch:
    inputs:
      args:
        description: 'scripts/probe_web_source.py に渡す引数'
        required: false
        default: 'keibanomiryoku rihua-keiba speedkeiba'
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python3 scripts/probe_web_source.py ${{ inputs.args }}

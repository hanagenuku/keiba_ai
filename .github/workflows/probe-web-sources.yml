name: Probe web sources (記事の作りの下見・手動)

# scripts/probe_web_source.py。結果はログだけ（本文は出さない）。何もコミットしない。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python3 scripts/probe_web_source.py keibanomiryoku rihua-keiba speedkeiba

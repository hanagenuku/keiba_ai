          const evBadge = '';
          const changeBadge = '';

          if (tc === 'sanfuku' && b.nums) {
            const synStr = b.syn_odds ? ' 合成'+b.syn_odds.toFixed(1)+'倍' : '';
            const ttype = b.trio_type || (b.is_box ? 'box' : 'list');
            const legs = b.legs || [];
            const combos = b.combos || [];
            const chipColor = isRemoved ? '#999' : '#117a65';
            const chipStyle = 'display:inline-block;min-width:22px;text-align:center;background:'+chipColor+';color:#fff;border-radius:50%;padding:2px 5px;font-size:11px;font-weight:700';
            const legLabel = 'display:inline-block;width:32px;font-size:10px;color:#888;flex-shrink:0';

            html += '<div style="margin:6px 0;padding:8px 10px;background:rgba(17,122,101,0.06);border-radius:6px;font-size:12px;'+rowOpacity+'">';
            html += '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">';
            html += '<span class="btype sanfuku">'+b.label+'</span>';
            html += evBadge;
            html += changeBadge;
            html += '</div>';

            if (ttype === 'box') {
              html += '<div style="margin-top:5px;display:flex;align-items:center;gap:4px;flex-wrap:wrap">';
              html += '<span style="font-size:11px;color:#555;font-weight:600">BOX</span>';
              for (const n of b.nums) { html += '<span style="'+chipStyle+'">'+n+'</span>'; }
              html += '</div>';
            } else if (ttype === 'formation' && legs.length === 3) {
              for (let i = 0; i < 3; i++) {
                html += '<div style="margin-top:'+(i===0?'5':'2')+'px;display:flex;align-items:center;gap:4px;flex-wrap:wrap">';
                html += '<span style="'+legLabel+'">'+(i===0?'軸':(i+1)+'列目')+'</span>';
                for (const n of legs[i]) { html += '<span style="'+chipStyle+'">'+n+'</span>'; }
                html += '</div>';
              }
            } else {
              html += '<div style="margin-top:5px;display:flex;flex-wrap:wrap;gap:3px">';
              for (const c of combos) {
                html += '<span style="background:#fff;border:1px solid #ddd;border-radius:3px;padding:1px 5px;font-size:10px;font-weight:600;white-space:nowrap">'+c+'</span>';
              }
              html += '</div>';
            }

            html += '<div style="margin-top:4px;display:flex;align-items:center;gap:8px;font-size:11px;color:#666">';
            html += '<span>'+b.est+synStr+'</span>';
            html += '<span class="bamt" style="margin-left:auto">'+b.amt+'</span>';
            html += '</div>';
            html += '</div>';
          } else if (b.mates && b.axis != null) {
            // 馬連・ワイドを「軸 - 相手」の1ブロックにまとめる。
            // 1点ずつ並べると全部に軸が入っていることが読み取れないため。
            const chip = 'display:inline-block;min-width:22px;text-align:center;background:#117a65;color:#fff;border-radius:50%;padding:2px 5px;font-size:11px;font-weight:700';
            const mchip = 'display:inline-block;min-width:22px;text-align:center;background:#fff;border:1px solid #117a65;color:#117a65;border-radius:50%;padding:2px 5px;font-size:11px;font-weight:700';
            html += '<div style="margin:6px 0;padding:8px 10px;background:rgba(17,122,101,0.06);border-radius:6px;font-size:12px;'+rowOpacity+'">';
            html += '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">';
            html += '<span class="btype '+tc+'">'+b.label+'</span>';
            html += changeBadge;
            html += '</div>';
            html += '<div style="margin-top:5px;display:flex;align-items:center;gap:4px;flex-wrap:wrap">';
            html += '<span style="'+chip+'">'+b.axis+'</span>';
            html += '<span style="color:#888;font-weight:700">-</span>';
            for (const m of b.mates) { html += '<span style="'+mchip+'">'+m.n+'</span>'; }
            html += '</div>';
            html += '<div style="margin-top:4px;display:flex;align-items:center;gap:8px;font-size:11px;color:#666">';
            html += '<span>'+b.est+(b.syn_odds ? ' 合成'+b.syn_odds.toFixed(1)+'倍' : '')+'</span>';
            html += '<span class="bamt" style="margin-left:auto">'+b.amt+'</span>';
            html += '</div>';
            html += '</div>';
          } else {
            html += '<div class="bet" style="'+rowOpacity+'">';
            html += '<span class="btype '+tc+'">'+b.label+'</span>';
            html += '<span class="bhorse">'+b.horse+'</span>';
            html += '<span class="best">'+b.est+'</span>';
            html += evBadge;
            html += changeBadge;
            html += '<span class="bamt">'+b.amt+'</span>';
            html += '</div>';
          }
        }
      }
      // AI強気ペア(A×D) 馬連・ワイド。回収率未検証のため必ず注記を出す。
      const apb = race.ai_pair_bets;
      if (apb && (apb.umaren||[]).length) {
        html += '<div class="sec" style="margin-top:12px;font-size:11px;color:#8e44ad">'
             +  '🧪 AI強気ペア（馬連・ワイド）'
             +  '<span style="font-size:9px;color:#fff;background:#8e44ad;border-radius:3px;padding:1px 5px;margin-left:6px;font-weight:700">検証中</span>'
             +  '</div>';
        for (const p of apb.umaren) {
          const chip = 'display:inline-block;min-width:22px;text-align:center;background:#8e44ad;color:#fff;border-radius:50%;padding:2px 5px;font-size:11px;font-weight:700';
          html += '<div class="bet" style="align-items:flex-start">';
          html += '<span class="btype" style="background:#8e44ad">馬連/ワイド</span>';
          html += '<span class="bhorse"><span style="'+chip+'">'+p.nums[0]+'</span>'
               +  ' - <span style="'+chip+'">'+p.nums[1]+'</span></span>';
          html += '</div>';
          html += '<div style="font-size:10px;color:#666;margin:-2px 0 6px 4px">'
               +  '軸 #'+p.axis_num+' '+p.axis_pop+'番人気→AI'+p.axis_ai+'位 ／ '
               +  '相手 #'+p.partner_num+' '+p.partner_pop+'番人気→AI'+p.partner_ai+'位'
               +  '</div>';
        }
        const m = apb.measured || {};
        html += '<div style="font-size:9px;color:#999;margin:0 0 4px 4px;line-height:1.5">'
             +  '⚠ 実配当が保存されていないため<b>回収率は未検証</b>です。'
             +  (m.races ? m.races.toLocaleString()+'レースの検証で市場示唆比 馬連'
                 +(m.umaren?m.umaren.ratio:'-')+' / ワイド'+(m.wide?m.wide.ratio:'-')
                 +'（損益分岐'+(m.breakeven_ratio||1.29)+'）ですが、' : '')
             +  'これは近似確率との比率であり期待値の確認ではありません。'
             +  '</div>';
      }
      html += '</div>';
      if (race.rec && race.formation && !hasGumbel) {
        html += formationHtml(race.formation);
      }
      html += '<div class="cmt">'+(race.cmt||'').replace(/</g,'&lt;')+'</div></div></div>';
    }
    html += '</div>';
  }
  document.getElementById('race-list').innerHTML = html;
}


// ── パドック入力（レース前・全頭を1画面で採点する） ─────────────────────
// 不利メモ(📝)がレース**後**の回顧なのに対し、こちらはレース**前**の見立て。
// スキーマの phase=='pre' の項目だけを扱い、1レース分をまとめて保存する。
// ⚠ 現時点で予想には一切反映していない（重みを勘で決めると
//   error_tags の週次補正と同じ「誰も検証しないまま本番を書き換える」状態になる）。
//   蓄積だけ先に行い、実データが溜まってから基準を先に決めて測る。
function paddockCategories(schema) {
  return (schema.categories || []).filter(c => c.phase === 'pre');
}

async function openPaddockEditor(raceKey) {
  const race = findRace(raceKey);
  if (!race || !race.race_id) { alert('レースIDが見つかりません'); return; }
  let schema;
  try {
    schema = await fetchNoteSchema();
  } catch (err) {
    alert('スキーマ取得エラー: ' + err.message);
    return;
  }
  const cats = paddockCategories(schema);
  if (!cats.length) { alert('パドック項目がスキーマにありません'); return; }
  const date = raceDateFromId(race.race_id);
  const horses = race.horses || [];

  let html = '<div class="note-overlay" id="pad-overlay" onclick="if(event.target===this)closePaddockEditor()">';
  html += '<div class="note-modal">';
  html += '<h3>🐎 パドック（' + date + ' ' + (race.name || '') + '）</h3>';
  html += '<div class="pad-note">出走前の見立てを全頭ぶん記録します。'
        + '未選択の馬は保存しません。<br>⚠ 記録のみで、いまの予想には反映されません。</div>';
  for (const cat of cats) {
    if (cats.length > 1) html += '<div class="note-row"><label>' + cat.label + '</label></div>';
    if (cat.guide) html += '<div class="pad-guide">' + cat.guide + '</div>';
    for (const h of horses) {
      html += '<div class="pad-row"><div class="pad-name">#' + h.n + ' ' + h.name + '</div>';
      html += '<div class="pad-opts">';
      for (const opt of cat.options) {
        html += '<label class="opt"><input type="radio" name="pd_' + cat.id + '_' + h.n + '"'
              + ' value="' + opt.value + '"><span>' + opt.label + '</span></label>';
      }
      html += '</div></div>';
    }
  }
  html += '<div class="note-actions" style="margin-top:12px">';
  html += '<button class="note-cancel" onclick="closePaddockEditor()">閉じる</button>';
  html += '<button class="note-save" id="pad-save-btn" onclick="savePaddock(this)">まとめて保存</button>';
  html += '</div></div></div>';

  const wrap = document.createElement('div');
  wrap.innerHTML = html;
  document.body.appendChild(wrap.firstChild);
  const ov = document.getElementById('pad-overlay');
  ov._race = race; ov._date = date; ov._schema = schema;
  // 🔴 race_notes は (date, race_id, horse_num) 単位で notes_data を丸ごと
  //    差し替える。ここで既存値を持っておかないと、パドックを保存した瞬間に
  //    📝側で入れた不利メモが消える（逆も同じ）。保存はこの読み込みを待つ。
  ov._existing = {};
  ov._loaded = loadExistingPaddock(ov, race, date, cats);
}

function closePaddockEditor() {
  const ov = document.getElementById('pad-overlay');
  if (ov) ov.remove();
}

// 既に入れた馬は選択状態を復元する（取得失敗は無視して空のまま続行）
async function loadExistingPaddock(ov, race, date, cats) {
  // 逐次だと18頭で数秒待たされるので並列で引く
  await Promise.all((race.horses || []).map(async (h) => {
    try {
      const url = GAS_URL + '?action=getNotes&date=' + encodeURIComponent(date)
                + '&race_id=' + encodeURIComponent(race.race_id) + '&horse_num=' + h.n;
      const res = await fetch(url, {redirect: 'follow'});
      const data = await res.json();
      const nd = (data.status === 'ok' && data.note && data.note.notes_data) || null;
      if (!nd) return;
      ov._existing[h.n] = nd;
      for (const cat of cats) {
        if (nd[cat.id] === undefined || nd[cat.id] === null) continue;
        const el = document.querySelector(
          'input[name="pd_' + cat.id + '_' + h.n + '"][value="' + nd[cat.id] + '"]');
        if (el) el.checked = true;
      }
    } catch (e) { /* 復元失敗は無視 */ }
  }));
}

// 採点済みの馬だけを {horse_num, notes} の配列にして返す
function collectPaddockValues(schema, horses, existing) {
  const cats = paddockCategories(schema);
  const preIds = cats.map(c => c.id);
  const out = [];
  for (const h of horses) {
    // 既存の値のうち、パドック項目**以外**（＝📝で入れた不利メモ）は残す
    const prev = (existing && existing[h.n]) || {};
    const notes = {};
    for (const k of Object.keys(prev)) {
      if (preIds.indexOf(k) === -1) notes[k] = prev[k];
    }
    let any = false;
    for (const cat of cats) {
      const sel = document.querySelector('input[name="pd_' + cat.id + '_' + h.n + '"]:checked');
      if (sel) { notes[cat.id] = parseFloat(sel.value); any = true; }
    }
    if (any) out.push({horse_num: h.n, horse_name: h.name || '', notes: notes});
  }
  return out;
}

async function savePaddock(btn) {
  const ov = document.getElementById('pad-overlay');
  const race = ov._race, date = ov._date, schema = ov._schema;
  btn.disabled = true;
  try { await ov._loaded; } catch (e) { /* 復元失敗でも保存は続ける */ }
  const rows = collectPaddockValues(schema, race.horses || [], ov._existing);
  if (!rows.length) { btn.disabled = false; alert('採点された馬がありません'); return; }

  const orig = btn.textContent;
  let ok = 0;
  const failed = [];
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    btn.textContent = '保存中 ' + (i + 1) + '/' + rows.length;
    try {
      const url = GAS_URL + '?action=saveNote'
        + '&date=' + encodeURIComponent(date)
        + '&race_id=' + encodeURIComponent(race.race_id)
        + '&racecourse=' + encodeURIComponent(venue || '')
        + '&race_num=' + encodeURIComponent(race.r || '')
        + '&horse_num=' + r.horse_num
        + '&horse_name=' + encodeURIComponent(r.horse_name)
        + '&notes_data=' + encodeURIComponent(JSON.stringify(r.notes))
        + '&free_memo=';
      const res = await fetch(url, {redirect: 'follow'});
      const data = await res.json();
      if (data.status !== 'ok') throw new Error(data.message || '保存失敗');
      ok++;
    } catch (err) {
      failed.push('#' + r.horse_num);
    }
  }
  if (failed.length) {
    alert(ok + '頭保存、' + failed.length + '頭失敗（' + failed.join(' ') + '）。もう一度お試しください。');
    btn.disabled = false; btn.textContent = orig;
  } else {
    btn.textContent = '✓ ' + ok + '頭 保存しました';
    setTimeout(() => { btn.disabled = false; btn.textContent = orig; }, 1500);
  }
}

// ── 不利メモ入力（race_notes / スキーマ駆動） ─────────────────────────────
const NOTE_SCHEMA_URL = 'https://hanagenuku.github.io/keiba_ai/data/note_schema.json';
const NOTE_SCHEMA_URL_FALLBACK = 'https://raw.githubusercontent.com/hanagenuku/keiba_ai/main/data/note_schema.json';
let _noteSchema = null;

// race_id（20260622... 先頭YYYYMMDD）から YYYY-MM-DD を作る
function raceDateFromId(raceId) {
  const m = (raceId || '').match(/^(\d{4})(\d{2})(\d{2})/);
  return m ? (m[1] + '-' + m[2] + '-' + m[3]) : '';
}

async function fetchNoteSchema() {
  if (_noteSchema) return _noteSchema;
  let res = await fetch(NOTE_SCHEMA_URL + '?t=' + Date.now(), {cache:'no-store'});
  if (!res.ok) res = await fetch(NOTE_SCHEMA_URL_FALLBACK + '?t=' + Date.now(), {cache:'no-store'});
  if (!res.ok) throw new Error('note_schema.json が取得できません');
  _noteSchema = await res.json();
  return _noteSchema;
}

async function openNoteEditor(raceKey) {
  const race = findRace(raceKey);
  if (!race || !race.race_id) { alert('レースIDが見つかりません'); return; }
  let schema;
  try {
    schema = await fetchNoteSchema();
  } catch (err) {
    alert('スキーマ取得エラー: ' + err.message);
    return;
  }
  const horses = race.horses || [];
  const date = raceDateFromId(race.race_id);

  let opts = horses.map(h => '<option value="'+h.n+'">#'+h.n+' '+h.name+'</option>').join('');
  let html = '<div class="note-overlay" id="note-overlay" onclick="if(event.target===this)closeNoteEditor()">';
  html += '<div class="note-modal">';
  html += '<h3>📝 不利メモ（'+date+' '+(race.name||'')+'）</h3>';
  html += '<select class="note-sel" id="note-horse" onchange="onNoteHorseChange()">'+opts+'</select>';
  html += '<div id="note-form"></div>';
  html += '</div></div>';

  const wrap = document.createElement('div');
  wrap.innerHTML = html;
  document.body.appendChild(wrap.firstChild);

  // モーダルにレース情報を保持
  const ov = document.getElementById('note-overlay');
  ov._race = race; ov._date = date; ov._schema = schema;
  onNoteHorseChange();
}

function closeNoteEditor() {
  const ov = document.getElementById('note-overlay');
  if (ov) ov.remove();
}

async function onNoteHorseChange() {
  const ov = document.getElementById('note-overlay');
  if (!ov) return;
  const schema = ov._schema, race = ov._race, date = ov._date;
  const horseNum = parseInt(document.getElementById('note-horse').value, 10);
  const horse = (race.horses||[]).find(h => h.n === horseNum) || {};

  // 既存メモを取得（失敗しても空で続行）
  let existing = null;
  try {
    const url = GAS_URL + '?action=getNotes&date=' + encodeURIComponent(date)
              + '&race_id=' + encodeURIComponent(race.race_id)
              + '&horse_num=' + horseNum;
    const res = await fetch(url, {redirect:'follow'});
    const data = await res.json();
    if (data.status === 'ok') existing = data.note;
  } catch (e) { /* 既存取得失敗は無視 */ }

  const ex = existing && existing.notes_data ? existing.notes_data : {};
  // 🔴 保存は notes_data を丸ごと差し替えるので、🐎側で入れたパドック気配を
  //    ここで抱えておかないと 📝 を保存した瞬間に消える。
  ov._existingNotes = ex;
  let html = '';
  // phase=='pre'（パドック気配）はレース前に🐎側で入れるのでここには出さない。
  // 同じ項目が2画面に出ると、後から開いた側の未選択が先の入力を消しかねない。
  for (const cat of (schema.categories || []).filter(c => c.phase !== 'pre')) {
    html += '<div class="note-row"><label>'+cat.label+'</label><div class="note-options">';
    for (const opt of cat.options) {
      const checked = (ex[cat.id] === opt.value) ? 'checked' : '';
      html += '<label class="opt"><input type="radio" name="nt_'+cat.id+'" value="'+opt.value+'" '+checked
            + ' onchange="updateNotePreview()"><span>'+opt.label+'</span></label>';
    }
    html += '</div></div>';
  }
  if (schema.free_memo) {
    html += '<div class="note-row"><label>メモ</label><textarea class="note-memo" id="note-free">'
          + (existing && existing.free_memo ? existing.free_memo : '') + '</textarea></div>';
  }
  html += '<div class="note-preview">補正値: <span id="note-hcap">0</span></div>';
  html += '<div class="note-actions">';
  html += '<button class="note-cancel" onclick="closeNoteEditor()">閉じる</button>';
  html += '<button class="note-save" id="note-save-btn" onclick="saveNote(this)">保存 #'+horseNum+' '+(horse.name||'')+'</button>';
  html += '</div>';
  document.getElementById('note-form').innerHTML = html;
  updateNotePreview();
}

function collectNoteValues() {
  const ov = document.getElementById('note-overlay');
  const schema = ov._schema;
  const notes = {};
  let total = 0;
  for (const cat of (schema.categories || []).filter(c => c.phase !== 'pre')) {
    const sel = document.querySelector('input[name="nt_'+cat.id+'"]:checked');
    if (sel) {
      const v = parseFloat(sel.value);
      notes[cat.id] = v;
      if (cat.feature) total += v * (cat.weight || 1.0);
    }
  }
  return { notes, total: Math.round(total * 100) / 100 };
}

function updateNotePreview() {
  const el = document.getElementById('note-hcap');
  if (el) el.textContent = collectNoteValues().total;
}

async function saveNote(btn) {
  const ov = document.getElementById('note-overlay');
  const race = ov._race, date = ov._date;
  const horseNum = parseInt(document.getElementById('note-horse').value, 10);
  const horse = (race.horses||[]).find(h => h.n === horseNum) || {};
  const { notes } = collectNoteValues();
  // パドック項目（phase=='pre'）はこの画面に出していないので、既存値を戻す
  const prev = ov._existingNotes || {};
  for (const cat of (ov._schema.categories || [])) {
    if (cat.phase === 'pre' && prev[cat.id] !== undefined && prev[cat.id] !== null) {
      notes[cat.id] = prev[cat.id];
    }
  }
  const freeEl = document.getElementById('note-free');
  const freeMemo = freeEl ? freeEl.value : '';

  btn.disabled = true; const orig = btn.textContent; btn.textContent = '保存中...';
  try {
    const url = GAS_URL + '?action=saveNote'
      + '&date=' + encodeURIComponent(date)
      + '&race_id=' + encodeURIComponent(race.race_id)
      + '&racecourse=' + encodeURIComponent(venue || '')
      + '&race_num=' + encodeURIComponent(race.r || '')
      + '&horse_num=' + horseNum
      + '&horse_name=' + encodeURIComponent(horse.name || '')
      + '&notes_data=' + encodeURIComponent(JSON.stringify(notes))
      + '&free_memo=' + encodeURIComponent(freeMemo);
    const res = await fetch(url, {redirect:'follow'});
    const data = await res.json();
    if (data.status !== 'ok') throw new Error(data.message || '保存失敗');
    btn.textContent = '✓ 保存しました';
    setTimeout(() => { btn.disabled = false; btn.textContent = orig; }, 1200);
  } catch (err) {
    alert('保存エラー: ' + err.message);
    btn.disabled = false; btn.textContent = orig;
  }
}

let _currentPage = 'predict';

  document.getElementById('page-stats').style.display   = page === 'stats'   ? '' : 'none';

// ── 成績ページ ───────────────────────────────────────────────────────────
let _statsCache = null;

// stats.json を1回だけ取りに行く（成績ページと下部バーで共用）
async function _fetchStats() {
  if (_statsCache) return _statsCache;
  let res = await fetch(STATS_URL + '?t=' + Date.now(), {cache:'no-store'});
  if (!res.ok) res = await fetch(STATS_URL_FALLBACK + '?t=' + Date.now(), {cache:'no-store'});
  if (!res.ok) throw new Error('stats.json が見つかりません（まだ生成されていません）');
  _statsCache = await res.json();
  return _statsCache;
}

// ⚠ stats.json の results_status.workflow_run_at は **必ず1回前の実行時刻**になる。
// generate_stats.py が workflow_status.json を読む時点では、その回の
// 「Write status」ステップがまだ走っていないため。
// 2026-08-09に「20:10に結果取得したのに成績ページの最終実行が09:49（今朝の
// refresh）のまま」となり、実行されていないように見えた。
// そこで最終実行の表示だけは workflow_status.json を**その場で取り直す**。
let _wfStatusCache = null;
async function _fetchLiveWorkflowStatus() {
  if (_wfStatusCache) return _wfStatusCache;
  try {
    let res = await fetch(STATUS_URL_FALLBACK + '?t=' + Date.now(), {cache:'no-store'});
    if (!res.ok) res = await fetch(STATUS_URL + '?t=' + Date.now(), {cache:'no-store'});
    if (!res.ok) return null;
    _wfStatusCache = await res.json();
    return _wfStatusCache;
  } catch (_) { return null; }
}

// 下部バーに「実績ROI」を入れる。
// 決済済みの実ベットを通算した確定値で、予測ではない。
// 月単位だと直近月がN=7点などになりブレるため通算を出す。
async function _fillActualRoi() {
  const el = document.getElementById('b-roi');
  const lbl = document.getElementById('b-roi-lbl');
  try {
    const S = await _fetchStats();
    const rows = S.weekly_roi || [];
    const inv = rows.reduce((a, r) => a + (r.invested || 0), 0);
    const rec = rows.reduce((a, r) => a + (r.recovered || 0), 0);
    if (!inv) { el.textContent = '-'; return; }
    const roi = rec / inv * 100;
    el.textContent = roi.toFixed(0) + '%';
    // 損益分岐点(100%)を割っているうちは色で誤解させない
    el.style.color = roi >= 100 ? '' : 'var(--sub)';
    const months = rows.map(r => r.month).filter(Boolean);
    if (lbl && months.length) lbl.textContent = `実績ROI(${months[0]}〜)`;
    el.parentElement.title =
      `実際に記録した買い目の確定回収率（予測ではありません）\n`
      + `投資 ¥${inv.toLocaleString()} / 回収 ¥${rec.toLocaleString()}`;
  } catch (_) {
    el.textContent = '-';   // 結果未取得なら黙って空欄（作り話をしない）
  }
}

async function loadStats() {
  const el = document.getElementById('page-stats');
  if (_statsCache) { renderStats(_statsCache); return; }
  el.innerHTML = '<div class="loading"><div class="loading-spin">📊</div><div>成績データ読み込み中...</div></div>';
  try {
    const S = await _fetchStats();
    S._live_status = await _fetchLiveWorkflowStatus();
    renderStats(S);
  } catch(e) {
    el.innerHTML = '<div class="error-box">⚠️ ' + e.message + '<br><br>土曜/日曜結果を取得すると自動生成されます。</div>';
  }
}

function renderStats(S) {
  const el = document.getElementById('page-stats');
  let h = '';

  // ── 結果取得ステータス ───────────────────────────────────────────────
  const rs = S.results_status || {};
  const rsDate  = rs.last_date || null;
  const rsRaces = rs.races || 0;
  const rsVenues = rs.venues || [];
  // 最終実行はライブの workflow_status.json を優先する。
  // stats.json 側の値は1回前のものなので、取得に失敗した時のフォールバック止まり。
  const live = S._live_status || {};
  const rsRunAt  = live.updated_at || rs.workflow_run_at || null;
  const rsResult = live.status     || rs.workflow_result || null;

  h += '<div class="stat-card"><div class="stat-title">📡 最終結果取得状況</div>';
  if (rsDate) {
    h += `<div class="stat-row"><span class="stat-key">最終保存日</span><span class="stat-val">${rsDate}</span></div>`;
    h += `<div class="stat-row"><span class="stat-key">取得レース数</span><span class="stat-val">${rsRaces}R</span></div>`;
    if (rsVenues.length) {
      const vStr = rsVenues.map(v => `${v.name}(${v.races}R)`).join('&nbsp; ');
      h += `<div class="stat-row"><span class="stat-key">取得会場</span><span class="stat-val" style="font-size:11px">${vStr}</span></div>`;
    }
  } else {
    h += '<div style="color:var(--sub);font-size:12px">結果未取得</div>';
  }
  if (rsRunAt) {
    const jstMs = new Date(rsRunAt).getTime() + 9 * 3600 * 1000;
    const jstStr = new Date(jstMs).toISOString().replace('T',' ').slice(0,16) + ' JST';
    const isOk = rsResult === 'success' && rsRaces > 0;
    const statusLabel = rsRaces > 0 ? '✅ 取得成功' : '⚠️ 取得失敗（0R）';
    h += `<div class="stat-row"><span class="stat-key">最終実行</span><span class="stat-val" style="font-size:11px">${jstStr}</span></div>`;
    h += `<div class="stat-row"><span class="stat-key">実行結果</span><span class="stat-val ${isOk?'pos':'neg'}">${statusLabel}</span></div>`;
  }
  h += '</div>';

  // ── RL精度 ──────────────────────────────────────────────────────────
  const rl = S.rl_accuracy || {};
  h += '<div class="stat-card"><div class="stat-title">🎯 RL予測精度（全レース）</div>';
  if (rl.total_races > 0) {
    h += `<div style="font-size:11px;color:var(--sub);margin-bottom:8px">集計対象: ${rl.total_races}レース</div>`;
    h += '<div class="rl-grid">';
    h += _rlCell('RL1位 勝率', rl.rl1_win_rate + '%');
    h += _rlCell('RL1位 3着内', rl.rl1_top3_rate + '%');
    h += _rlCell('RL2位 3着内', rl.rl2_top3_rate + '%');
    h += _rlCell('RL3位 3着内', rl.rl3_top3_rate + '%');
    h += '</div>';
    // 波乱度別
    if (rl.by_chaos && Object.keys(rl.by_chaos).length) {
      h += '<div style="margin-top:10px;font-size:11px;font-weight:700;color:var(--sub);margin-bottom:6px">波乱度別 RL1位成績</div>';
      const gradeLabel = {A:'堅い',B:'中荒れ',C:'大荒れ'};
      const gradeColor = {A:'#2980b9',B:'#e67e22',C:'#c0392b'};
      for (const [g, d] of Object.entries(rl.by_chaos)) {
        h += `<div class="stat-row"><span class="stat-key"><span style="background:${gradeColor[g]||'#999'};color:#fff;font-size:9px;padding:1px 5px;border-radius:3px">${g} ${gradeLabel[g]||''}</span> ${d.total}R</span>`;
        h += `<span class="stat-val">勝率${d.rl1_win_rate}% / 3着内${d.rl1_top3_rate}%</span></div>`;
      }
    }
  } else {
    h += '<div style="color:var(--sub);font-size:12px">データ蓄積中（土日結果取得後に表示されます）</div>';
  }
  h += '</div>';

  // ── 券種別実績 ──────────────────────────────────────────────────────
  const byType = S.by_type || [];
  h += '<div class="stat-card"><div class="stat-title">💴 券種別実績</div>';
  if (byType.length) {
    for (const t of byType) {
      const roi = t.roi;
      const barW = Math.min(100, Math.abs(roi - 100));
      h += `<div style="margin-bottom:8px">`;
      h += `<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px">`;
      h += `<span style="font-weight:700">${t.type}</span>`;
      h += `<span style="color:var(--sub)">${t.hit}/${t.total}件 (${t.hit_rate}%)</span>`;
      h += `<span class="stat-val ${roi>=100?'pos':'neg'}">${roi}%</span></div>`;
      h += `<div class="roi-bar-wrap"><div class="roi-bar ${roi<100?'neg':''}" style="width:${Math.min(100,roi)}%"></div></div>`;
      h += `<div style="font-size:10px;color:var(--sub)">投資¥${t.invested.toLocaleString()} / 回収¥${t.recovered.toLocaleString()}</div>`;
      h += '</div>';
    }
  } else {
    h += '<div style="color:var(--sub);font-size:12px">データなし</div>';
  }
  h += '</div>';

  // ── 月別ROI ─────────────────────────────────────────────────────────
  const weekly = S.weekly_roi || [];
  h += '<div class="stat-card"><div class="stat-title">📈 月別ROI</div>';
  if (weekly.length) {
    for (const w of [...weekly].reverse()) {
      const roi = w.roi;
      h += `<div class="stat-row">`;
      h += `<span class="stat-key">${w.month}</span>`;
      h += `<span style="font-size:11px;color:var(--sub)">${w.hit}/${w.total}件</span>`;
      h += `<span class="stat-val ${roi>=100?'pos':'neg'}">${roi}%</span>`;
      h += '</div>';
    }
  } else {
    h += '<div style="color:var(--sub);font-size:12px">データなし</div>';
  }
  h += '</div>';

  // ── 直前オッズの変動 ──────────────────────────────────────────────────
  // 2026-07-13 から週次で集計していたが **画面に一度も出ていなかった**（2026-08-26発覚）。
  // 🔴 ただし「買われた馬を買う」根拠にしてはいけない。2026-08-03 の実測では
  //    最も買われた帯の回収率は 58.2% で、無作為(80%)より悪い。
  //    勝率は上がるが配当が縮むため（North Star #9）。結論を併記して出す。
  const om = S.odds_movement || {};
  h += '<div class="stat-card"><div class="stat-title">📈 直前オッズの変動と結果</div>';
  if ((om.bucket_stats || []).length) {
    h += `<div style="font-size:11px;color:var(--sub);margin-bottom:8px">朝→直前の変動別 ${om.total_horses}頭。↓は買われた（オッズが下がった）方向</div>`;
    for (const b of om.bucket_stats) {
      if (!b.count) continue;
      h += '<div class="stat-row">';
      h += `<span>${b.bucket}<span style="font-size:10px;color:var(--sub)"> ${b.count}頭</span></span>`;
      h += `<span class="stat-val">勝率${b.win_rate}% / 3着内${b.top3_rate}%</span>`;
      h += '</div>';
    }
    const ag = om.ai_agrees_rising || {}, ig = om.ai_ignores_rising || {};
    if (ag.count && ig.count) {
      h += '<div style="font-size:11px;color:var(--sub);margin:10px 0 4px">買われた馬をAIも評価していたか</div>';
      h += `<div class="stat-row"><span>AIも高評価<span style="font-size:10px;color:var(--sub)"> ${ag.count}頭</span></span><span class="stat-val">3着内 ${ag.top3_rate}%</span></div>`;
      h += `<div class="stat-row"><span>AIは低評価<span style="font-size:10px;color:var(--sub)"> ${ig.count}頭</span></span><span class="stat-val">3着内 ${ig.top3_rate}%</span></div>`;
    }
    h += '<div style="font-size:10px;color:#c0392b;margin-top:8px">🔴 買われた馬を追ってはいけません。2026-08-03の実測で最も買われた帯の回収率は58.2%と、無作為(80%)より悪い。勝率は上がりますが配当が縮みます</div>';
  } else {
    h += '<div style="color:var(--sub);font-size:12px">データなし（直前オッズ取得が必要）</div>';
  }
  h += '</div>';

  // ── 市場ベースラインKPI ───────────────────────────────────────────────
  // このプロジェクト唯一のKPI（CLAUDE.md）。AIと市場の log-loss を比べ、
  // delta = AI − 市場 が負ならAI優位。**画面に無いと誰も見ないので出す。**
  // ⚠ これは「当てる精度」であって回収率ではない（North Star #9）。
  const kpi = S.model_kpi || {};
  h += '<div class="stat-card"><div class="stat-title">📉 市場ベースラインKPI（AI vs 市場）</div>';
  if (kpi.total_races) {
    const d = kpi.delta;
    // 負ならAI優位。0.001未満の差は「同等」とみなす（generate_stats.py と同じ判定）
    const col = d < -0.001 ? '#27ae60' : d > 0.001 ? '#c0392b' : '#e67e22';
    h += `<div style="font-size:11px;color:var(--sub);margin-bottom:8px">累計 ${kpi.total_races}レース ${kpi.total_horses}頭　log-lossは小さいほど正確</div>`;
    h += '<div class="stat-row"><span>AI</span>'
      + `<span class="stat-val">${kpi.ai_logloss}</span></div>`;
    h += '<div class="stat-row"><span>市場（オッズ）</span>'
      + `<span class="stat-val">${kpi.mkt_logloss}</span></div>`;
    h += '<div class="stat-row"><span>差 (AI − 市場)</span>'
      + `<span class="stat-val" style="color:${col}">${d > 0 ? '+' : ''}${d}　${kpi.verdict}</span></div>`;
    const wk = (kpi.weekly || []).slice(-8);
    if (wk.length >= 2) {
      const mx = Math.max(...wk.map(w => Math.abs(w.delta)), 0.01);
      h += '<div style="font-size:11px;color:var(--sub);margin:10px 0 4px">直近の推移（左が古い・短いほど市場に近い）</div>';
      h += '<div style="display:flex;align-items:flex-end;gap:3px;height:46px">';
      for (const w of wk) {
        const hp = Math.max(2, Math.abs(w.delta) / mx * 40);
        const c = w.delta < 0 ? '#27ae60' : '#c0392b';
        h += `<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%" title="${w.date} delta ${w.delta > 0 ? '+' : ''}${w.delta}（${w.races}R）">`;
        h += `<div style="background:${c};height:${hp}px;border-radius:2px 2px 0 0"></div></div>`;
      }
      h += '</div>';
      h += `<div style="font-size:10px;color:var(--sub);margin-top:4px">${wk[0].date} 〜 ${wk[wk.length-1].date}　赤=市場優位 / 緑=AI優位</div>`;
    }
    h += '<div style="font-size:10px;color:var(--sub);margin-top:8px">⚠ 当てる精度の指標です。これが改善しても回収率が上がるとは限りません</div>';
  } else {
    h += '<div style="color:var(--sub);font-size:12px">データなし</div>';
  }
  h += '</div>';

  // ── AIの盲点パターン ─────────────────────────────────────────────────
  const up = S.upset_patterns || {};
  h += '<div class="stat-card"><div class="stat-title">🔍 AI上位3頭の当たり方</div>';
  if ((up.total_races || 0) < 5) {
    h += '<div style="color:var(--sub);font-size:12px">データ蓄積中（土日結果が増えると自動表示されます）</div>';
  } else {
    const _rnd = up.random_hit3_rate || 0;
    const _mult = _rnd > 0 ? (up.overall_hit3_rate / _rnd) : 0;
    h += `<div style="font-size:11px;color:var(--sub);margin-bottom:10px">集計対象: ${up.total_races}レース<br>`;
    h += `<strong style="color:#27ae60">AI上位3頭が実際の3着内と完全一致: ${up.overall_hit3_rate}%</strong>`;
    h += `（＝三連複をAI上位3頭ボックス1点で買った時の的中率）<br>`;
    h += `無作為に3頭選んだ場合は ${_rnd}% なので${_mult >= 2 ? ` <strong>約${Math.round(_mult)}倍</strong>` : ''}。<br>`;
    h += `AI上位3頭が1頭も3着内に入らなかった（全滅）: <strong style="color:#c0392b">${up.overall_full_miss_rate}%</strong></div>`;

    // 盲点ランキング（複合条件）
    if ((up.blind_spots || []).length) {
      h += `<div style="font-size:11px;font-weight:700;color:#c0392b;margin-bottom:6px">⚠️ 全滅が多い条件（偶然では説明しにくい順・N≥${up.blind_spot_min_n || 30}）</div>`;
      h += '<table style="width:100%;font-size:11px;border-collapse:collapse">';
      h += '<tr style="background:var(--g1);color:#fff"><th style="padding:4px 6px;text-align:left">条件</th><th style="padding:4px;text-align:center">件数</th><th style="padding:4px;text-align:center">全滅率</th><th style="padding:4px;text-align:center">3頭的中率</th><th style="padding:4px;text-align:center">偶然の確率</th></tr>';
      for (const b of (up.blind_spots || [])) {
        const danger = b.p_chance <= 0.05 ? '#c0392b' : b.p_chance <= 0.20 ? '#e67e22' : '#2c3e50';
        h += `<tr style="border-bottom:1px solid #f0ece4">`;
        h += `<td style="padding:5px 6px;font-weight:600">${b.label}</td>`;
        h += `<td style="padding:5px 4px;text-align:center;color:var(--sub)">${b.total}R</td>`;
        h += `<td style="padding:5px 4px;text-align:center;font-weight:800;color:${danger}">${b.full_miss_rate}%</td>`;
        h += `<td style="padding:5px 4px;text-align:center;color:#27ae60">${b.hit3_rate}%</td>`;
        h += `<td style="padding:5px 4px;text-align:center;color:var(--sub)">${(b.p_chance*100).toFixed(0)}%</td>`;
        h += '</tr>';
      }
      h += '</table><div style="font-size:10px;color:var(--sub);margin-top:4px">「偶然の確率」= 全体の全滅率が同じだと仮定した時に、この条件でこれ以上の全滅が起きる確率。高いほど「ただの偶然」。<strong>20%を超えるものは読む価値がありません。</strong></div>';
    }

    // 波乱度別
    h += '<div style="margin-top:12px;font-size:11px;font-weight:700;color:var(--sub);margin-bottom:6px">波乱度別（3頭的中率 / 全滅率）</div>';
    const gradeColor2 = {A:'#2980b9', B:'#e67e22', C:'#c0392b'};
    for (const g of (up.by_chaos || [])) {
      const gc = gradeColor2[g.label] || '#999';
      h += `<div class="stat-row"><span class="stat-key"><span style="background:${gc};color:#fff;font-size:9px;padding:1px 5px;border-radius:3px">${g.label}</span> ${g.total}R</span>`;
      h += `<span class="stat-val">的中${g.hit3_rate}% / <span style="color:#c0392b">全滅${g.full_miss_rate}%</span></span></div>`;
    }

    // 芝/ダート・距離・頭数を横並びに
    const _dimRows = [
      {title:'馬場別', data: up.by_surface},
      {title:'距離別', data: up.by_distance},
      {title:'頭数別', data: up.by_heads},
      {title:'会場別', data: up.by_racecourse},
    ];
    // 各軸に出すのは「全滅率」。3頭完全一致は母数が小さすぎて軸別では読めない。
    h += '<div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px">';
    for (const dim of _dimRows) {
      h += `<div><div style="font-size:10px;font-weight:700;color:var(--sub);margin-bottom:4px">${dim.title}（全滅率）</div>`;
      for (const g of (dim.data || [])) {
        h += `<div style="display:flex;justify-content:space-between;font-size:11px;padding:2px 0;border-bottom:1px solid #f0ece4">`;
        h += `<span style="color:var(--text)">${g.label}</span>`;
        h += `<span style="font-weight:700;color:${g.full_miss_rate>=20?'#c0392b':g.full_miss_rate>=15?'#e67e22':'#555'}">${g.full_miss_rate}%</span>`;
        h += `</div>`;
      }
      h += '</div>';
    }
    h += '</div>';
  }
  h += '</div>';

  // ── 人気×RL乖離マトリクス（2026-07-27導入） ─────────────────────────
  // 「市場1番人気なのにRL5」「市場5番人気なのにRL1」のような順位の食い違いが
  // 実際の勝率・単勝回収率にどう出るかのセル別実績。回収率は勝ち馬の実オッズで
  // 厳密計算（generate_stats.py の _tansho_roi）
  const dv = S.divergence_analysis || {};
  const rm = dv.rank_matrix || [];
  h += '<div class="stat-card"><div class="stat-title">🎲 人気×AI順位 実績マトリクス（単勝回収率）</div>';
  if (rm.length) {
    h += `<div style="font-size:11px;color:var(--sub);margin-bottom:8px">集計対象: ${dv.total_races}レース ${dv.total_horses}頭　行=市場人気帯 / 列=AI RL帯。各セル上段=単勝回収率、下段=勝率(件数)</div>`;
    const bands = ['1', '2-3', '4-5', '6-9', '10+'];
    const cellMap = {};
    for (const c of rm) cellMap[c.pop_band + '|' + c.rl_band] = c;
    h += '<div style="overflow-x:auto"><table style="width:100%;font-size:10px;border-collapse:collapse;text-align:center">';
    h += '<tr style="background:var(--g1);color:#fff"><th style="padding:4px">人気＼RL</th>' + bands.map(b => `<th style="padding:4px">RL${b}</th>`).join('') + '</tr>';
    for (const pb of bands) {
      h += `<tr><td style="padding:4px;font-weight:700;background:#f5f2ea">${pb}人気</td>`;
      for (const rb of bands) {
        const c = cellMap[pb + '|' + rb];
        if (!c) { h += '<td style="padding:4px;color:#ccc">-</td>'; continue; }
        // 回収率の色: 100%以上=緑 / 80-100=橙 / 80未満=グレー。N<30は薄字（サンプル不足）
        const roiColor = c.tansho_roi >= 100 ? '#27ae60' : c.tansho_roi >= 80 ? '#e67e22' : '#999';
        const thin = c.count < 30 ? 'opacity:.55' : '';
        h += `<td style="padding:4px;border-bottom:1px solid #f0ece4;${thin}" title="市場${pb}人気×RL${rb}: ${c.count}頭 勝率${c.win_rate}% 複勝${c.top3_rate}% 単勝回収率${c.tansho_roi}%">`;
        h += `<div style="font-weight:800;color:${roiColor}">${c.tansho_roi}%</div>`;
        h += `<div style="color:var(--sub)">${c.win_rate}%<span style="font-size:9px">(${c.count})</span></div>`;
        h += '</td>';
      }
      h += '</tr>';
    }
    h += '</table></div>';
    h += '<div style="font-size:10px;color:var(--sub);margin-top:4px">薄い表示のセルはN&lt;30でサンプル不足。回収率100%超でもNが小さい間は偶然の可能性があります</div>';
  } else {
    h += '<div style="color:var(--sub);font-size:12px">データ蓄積中（次回の結果取得後に表示されます）</div>';
  }
  h += '</div>';

  // ── 直近レース一覧 ───────────────────────────────────────────────────
  const recent = S.recent_races || [];
  h += '<div class="stat-card"><div class="stat-title">📋 直近レース（RL vs 実着順）</div>';
  if (recent.length) {
    h += '<div style="overflow-x:auto"><table class="rtbl">';
    h += '<tr><th>日付</th><th>会場</th><th>R</th><th>波</th><th>RL1</th><th>RL2</th><th>RL3</th><th>1着</th><th>2着</th><th>3着</th><th>複</th><th>推</th></tr>';
    for (const r of recent) {
      const top3 = new Set([r.win, r.sec, r.thr]);
      const rl1ok = top3.has(r.rl1);
      const rl1win = r.rl1 === r.win;
      const gradeColor = {A:'#2980b9',B:'#e67e22',C:'#c0392b'}[r.chaos] || '#999';
      h += `<tr class="${rl1ok?'hit':''}">`;
      h += `<td>${(r.date||'').slice(5)}</td>`;
      h += `<td>${r.racecourse||''}</td>`;
      h += `<td>${r.race_num}</td>`;
      h += `<td><span style="background:${gradeColor};color:#fff;font-size:9px;padding:1px 4px;border-radius:2px">${r.chaos||'?'}</span></td>`;
      h += `<td style="font-weight:800;color:${rl1win?'#27ae60':rl1ok?'#e67e22':'#c0392b'}">#${r.rl1||'-'}</td>`;
      h += `<td class="${top3.has(r.rl2)?'hit-mark':'miss'}">#${r.rl2||'-'}</td>`;
      h += `<td class="${top3.has(r.rl3)?'hit-mark':'miss'}">#${r.rl3||'-'}</td>`;
      h += `<td style="font-weight:800">#${r.win||'-'}</td>`;
      h += `<td>#${r.sec||'-'}</td>`;
      h += `<td>#${r.thr||'-'}</td>`;
      h += `<td>${r.fuku_hit?'<span class="hit-mark">○</span>':'<span class="miss-mark">✗</span>'}</td>`;
      h += `<td>${r.rec?'⭐':''}</td>`;
      h += '</tr>';
    }
    h += '</table></div>';
    if (S.generated_at) h += `<div style="font-size:10px;color:var(--sub);margin-top:6px;text-align:right">更新: ${S.generated_at}</div>`;
  } else {
    h += '<div style="color:var(--sub);font-size:12px">データなし（土日結果取得後に表示されます）</div>';
  }
  h += '</div>';

  el.innerHTML = h;
}

function _rlCell(label, val) {
  return `<div class="rl-cell"><div class="rl-cell-label">${label}</div><div class="rl-cell-val">${val}</div></div>`;
}

// アプリに戻ってきた時、裏で予想が更新されていたら自動で読み直す。
// ボタンを押していなくても土日朝8時の自動refreshで latest.json は
// 更新されるので、開きっぱなしのアプリが古い予想を映し続けるのを防ぐ。
let _hiddenAt = 0;
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'hidden') { _hiddenAt = Date.now(); return; }
  if (_pollingTimer) return;                       // ボタン実行中は上の経路が見る
  if (!_hiddenAt || Date.now() - _hiddenAt < 60 * 1000) return;  // 一瞬の切替は無視
  _hiddenAt = 0;
  const ts = await _getLatestTimestamp();
  // 読み込み済みの生成時刻と違う時だけ再描画する（見ている最中に
  // 画面が勝手に作り直されるのを避けるため、変化が無ければ何もしない）
  if (ts && D && D.generated_at && ts !== D.generated_at) await loadData(true);
});

loadData().then(() => _restorePolling());
</script>
</body>
</html>

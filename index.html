<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="直馬">
<meta name="theme-color" content="#0a2e1a">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a2e1a'/><text y='62' x='50' font-size='58' text-anchor='middle'>🏇</text><text y='90' x='50' font-size='18' font-weight='bold' text-anchor='middle' fill='%23c9a84c' font-family='sans-serif'>直馬</text></svg>">
<title>KEIBA-AI v7</title><!-- build:20260620-1200 -->
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --g1:#0a2e1a;--g2:#1a5c34;--g3:#2d8a52;
  --gold:#c9a84c;--gold2:#e8c87a;
  --red:#c0392b;--blue:#1a5276;
  --bg:#f2efe8;--card:#fff;
  --text:#1a1a1a;--sub:#777;--border:#e0dbd0;
}
body{font-family:-apple-system,'Hiragino Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:430px;margin:0 auto;position:relative}
.hdr{background:var(--g1);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.hdr-logo{font-size:22px;font-weight:900;letter-spacing:3px;color:var(--gold2)}
.hdr-sub{font-size:9px;color:rgba(255,255,255,0.5);letter-spacing:2px;margin-top:1px}
.hdr-right{text-align:right}
.hdr-date{font-size:12px;color:rgba(255,255,255,0.85);font-weight:600}
.hdr-venues{font-size:10px;color:var(--gold);margin-top:2px}
.bias{background:var(--g2);padding:5px 16px;display:flex;justify-content:space-between;align-items:center}
.bias-txt{font-size:11px;color:rgba(255,255,255,0.75)}
.bias-tag{background:var(--gold);color:#fff;font-size:10px;font-weight:700;padding:2px 10px;border-radius:10px}
.tabs{background:var(--card);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;gap:8px;overflow-x:auto;position:sticky;top:56px;z-index:199;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 22px;border-radius:20px;border:1.5px solid var(--border);font-size:13px;font-weight:700;cursor:pointer;background:transparent;color:var(--sub);white-space:nowrap;transition:all .15s;flex-shrink:0}
.tab.on{background:var(--g1);color:#fff;border-color:var(--g1)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 10px 4px}
.sum-card{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:8px 10px;text-align:center}
.sum-label{font-size:9px;color:var(--sub);font-weight:600;letter-spacing:1px;text-transform:uppercase}
.sum-val{font-size:16px;font-weight:900;color:var(--g1);margin-top:2px}
.sum-val.gold{color:var(--gold)}
.list{padding:8px 10px 90px}
.rc{background:var(--card);border-radius:12px;border:1px solid var(--border);margin-bottom:8px;overflow:hidden}
.rc.rec{border:2px solid var(--gold)}
.rc-head{padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.rc-num{width:32px;height:32px;border-radius:50%;background:#f0ede6;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--sub);flex-shrink:0}
.rc.rec .rc-num{background:var(--gold);color:#fff}
.rc-info{flex:1;min-width:0}
.rc-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-meta{font-size:11px;color:var(--sub);margin-top:2px}
.rc-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.conf{background:var(--gold);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:8px}
.rec-lbl{font-size:10px;color:var(--gold);font-weight:700}
.new-rec-alert{font-size:10px;color:#fff;font-weight:800;background:#e74c3c;padding:2px 8px;border-radius:4px;animation:rec-pulse 1.2s ease-in-out infinite;display:inline-block}
@keyframes rec-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}
.arr{font-size:11px;color:var(--sub);transition:transform .2s;display:inline-block}
.arr.open{transform:rotate(180deg)}
.hstrip{padding:0 14px 10px;display:flex;align-items:center;gap:8px;cursor:pointer}
.hbadge{background:var(--red);color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:4px;flex-shrink:0}
.hname{font-size:13px;font-weight:700}
.hodds{font-size:12px;color:var(--sub);margin-left:auto}
.detail{display:none;border-top:1px solid var(--border)}
.detail.open{display:block}
.det-inner{padding:12px 14px;background:#faf8f3}
.sec{font-size:9px;font-weight:700;color:var(--sub);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
/* ★ 新テーブル */
.htbl{width:100%;font-size:11px;border-collapse:collapse}
.htbl th{font-weight:700;padding:4px 3px;text-align:center;border-bottom:2px solid #ddd;font-size:10px;color:#fff;background:var(--g1)}
.htbl th.col-name{text-align:left;background:#2d6a4f}
.htbl th.col-rl{background:#e67e22}
.htbl th.col-mk{background:#555;width:26px}
.htbl td{padding:5px 3px;border-bottom:1px solid #f0ece4;vertical-align:middle;text-align:center}
.htbl td.col-name{text-align:left;font-weight:600;max-width:75px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.htbl tr.hl td{background:rgba(201,168,76,0.10);font-weight:700}
.htbl td.col-rl{font-weight:800;color:#c0450a}
.htbl td.phi{color:#c0392b;font-weight:800}
.htbl td.plo{color:var(--g2);font-weight:600}
/* 人気列 */
.htbl th.col-um{background:#7d3c98;width:22px}
.htbl td.col-um{padding:0;width:22px}
/* 自分でつける印。AI本命の◎（番号列）と混ざらないよう紫系で区別する */
.umark{display:inline-block;min-width:20px;padding:7px 2px;font-size:13px;font-weight:800;
  line-height:1;color:#ccc;cursor:pointer;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent}
.umark:empty::before{content:'＋';font-size:10px;color:#d5d5d5;font-weight:400}
.umark-on{color:#7d3c98}
.htbl th.col-pop{background:#34495e;width:22px}
.htbl td.col-pop{font-weight:700;color:#555;font-size:10px}
/* 乖離バッジ */
.gap-up{color:#fff;background:#27ae60;font-size:8px;font-weight:800;border-radius:3px;padding:0 3px;margin-left:1px;display:inline-block}
.gap-down{color:#999;font-size:8px;font-weight:600;margin-left:1px;display:inline-block}
.gap-converge{color:#e67e22;font-size:7px;font-weight:600;margin-left:1px;display:inline-block}
/* AI評価内訳（ability_breakdown）バッジ。タップ/長押しでtitleツールチップ表示 */
.ability-badge{font-size:9px;margin-left:2px;cursor:help;opacity:.75}
/* オッズ列 */
.htbl th.col-odds{background:#2c3e50}
.htbl td.col-odds{font-size:10px;color:#666}
/* バリュー列 */
.htbl th.col-val{background:#117a65}
/* バリューバッジ（表内EV列は参考値。買い信号として緑強調しない・2026-07-24） */
.val-buy{color:#fff;background:#27ae60;font-weight:800;font-size:10px;border-radius:3px}
.val-neutral{color:#888;font-weight:600;font-size:10px}
.val-over{color:#999;font-size:10px}
.val-none{color:#ccc;font-size:10px}
.mk{display:inline-block;padding:1px 4px;border-radius:3px;font-size:9px;font-weight:800;line-height:1.5}
.mk-推{background:#8e44ad;color:#fff}
.mk-高{background:#27ae60;color:#fff}
.mk-穴{background:#e67e22;color:#fff}
/* ベット・コメント */
.bets{margin-top:10px}
.bet{display:flex;align-items:center;gap:6px;padding:7px 10px;background:#fff;border-radius:8px;margin-bottom:4px;border:1px solid var(--border)}
.btype{font-size:10px;font-weight:800;color:#fff;padding:2px 7px;border-radius:4px;flex-shrink:0}
.btype.fuku{background:var(--g2)}.btype.tan{background:var(--red)}.btype.wide{background:var(--blue)}
.btype.umaren{background:#6c3483}.btype.sanfuku{background:#117a65}.btype.santan{background:#b7950b}
.bhorse{font-size:12px;font-weight:600;flex:1}
.best{font-size:10px;color:var(--sub)}
.bamt{font-size:13px;font-weight:800;color:var(--g1);margin-left:auto;flex-shrink:0}
.cmt{margin-top:10px;padding:9px 12px;background:rgba(10,46,26,0.05);border-left:3px solid var(--g2);border-radius:0 8px 8px 0;font-size:12px;color:#444;line-height:1.7;white-space:pre-line}
/* 三連複フォーメーション */
.formation-box{background:rgba(26,92,58,0.05);border:1px solid rgba(26,92,58,0.2);border-radius:8px;padding:10px 14px;margin:8px 0}
.formation-title{font-size:12px;font-weight:700;color:#1a5c3a;margin-bottom:6px}
.formation-row{font-size:11px;padding:3px 0;display:flex;align-items:flex-start;gap:6px}
.row-label{display:inline-block;min-width:30px;font-size:10px;font-weight:700;color:#fff;text-align:center;border-radius:3px;padding:1px 4px;flex-shrink:0}
.axis-label{background:#c0392b}
.second-label{background:#e67e22}
.third-label{background:#2980b9}
.axis-horse{font-weight:700}
.formation-payout{font-size:10px;color:#666;margin-top:6px;padding-top:6px;border-top:1px dashed #ddd}
.result-banner{margin:8px 10px;padding:10px 14px;background:var(--card);border-radius:10px;border:1px solid var(--border)}
.result-banner.hit{border-color:#27ae60}
.rb-title{font-size:11px;font-weight:700;color:var(--sub);margin-bottom:4px}
.rb-stats{font-size:14px;font-weight:800;color:var(--g1)}
.rb-roi{font-size:12px;color:var(--sub);margin-top:2px}
.loading{text-align:center;padding:60px 20px;color:var(--sub)}
.loading-spin{font-size:36px;animation:spin 1s linear infinite;display:inline-block;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{margin:16px;padding:16px;background:#fff3f3;border:1px solid #e74c3c;border-radius:10px;font-size:13px;color:#c0392b;line-height:1.6}
.dq-warn-box{margin:8px 10px;padding:8px 12px;background:#fff8e6;border:1px solid #e67e22;border-radius:8px;font-size:11px;color:#a15c0a;line-height:1.6}
.btm{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--g1);padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;z-index:200;border-top:1px solid rgba(255,255,255,0.1)}
.btm-item{text-align:center}
.btm-lbl{font-size:9px;color:rgba(255,255,255,0.6);letter-spacing:1px;text-transform:uppercase}
.btm-val{font-size:15px;font-weight:900;color:var(--gold2)}
.reload-btn{display:block;margin:8px 10px;padding:10px;background:var(--g1);color:var(--gold2);border:none;border-radius:10px;font-size:13px;font-weight:700;width:calc(100% - 20px);cursor:pointer;letter-spacing:1px}
.pwa{background:rgba(201,168,76,0.12);border:1px solid var(--gold);border-radius:10px;margin:8px 10px;padding:9px 14px;font-size:12px;color:#5a4010;display:flex;align-items:center;gap:8px}
.pwa button{margin-left:auto;background:var(--gold);color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0}
.odds-btn{background:#2c3e50;color:#fff;border:none;border-radius:6px;padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer}
.odds-btn:active{background:#1a252f}
.odds-btn:disabled{background:#95a5a6}
.odds-time{font-size:10px;color:#888;margin-left:8px}
.note-btn{background:#8e44ad;color:#fff;border:none;border-radius:6px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;margin-left:8px}
.note-btn:active{background:#6c3483}
.umark-clear{background:#fff;color:#7d3c98;border:1px solid #c9a8dd;border-radius:6px;padding:8px 12px;font-size:11px;font-weight:700;cursor:pointer;margin-left:8px}
.umark-clear:active{background:#f3e8f8}
.note-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:1000}
.note-modal{background:#fff;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:16px}
.note-modal h3{margin:0 0 10px;font-size:15px}
.note-sel{width:100%;padding:9px;font-size:14px;border:1px solid #ccc;border-radius:8px;margin-bottom:12px}
.note-row{margin-bottom:12px}
.note-row > label{display:block;font-size:12px;font-weight:700;color:#555;margin-bottom:5px}
.note-options{display:flex;gap:6px;flex-wrap:wrap}
.note-options .opt{flex:1;min-width:56px}
.note-options .opt input{display:none}
.note-options .opt span{display:block;text-align:center;padding:8px 4px;font-size:13px;border:1px solid #ccc;border-radius:8px;cursor:pointer;background:#fafafa}
.note-options .opt input:checked + span{background:#8e44ad;color:#fff;border-color:#8e44ad;font-weight:700}
.note-memo{width:100%;min-height:48px;padding:8px;font-size:13px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
.note-preview{font-size:13px;font-weight:700;color:#8e44ad;margin:10px 0;text-align:right}
.note-actions{display:flex;gap:8px;margin-top:6px}
.note-actions button{flex:1;padding:11px;font-size:14px;font-weight:700;border:none;border-radius:8px;cursor:pointer}
.note-save{background:#8e44ad;color:#fff}
.note-save:disabled{background:#b09cc4}
.note-cancel{background:#eee;color:#333}
/* パドック入力（レース前・全頭を1画面で採点する） */
.pad-btn{background:#1e8449;color:#fff;border:none;border-radius:6px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;margin-left:8px}
.pad-btn:active{background:#145a32}
.pad-row{padding:7px 0;border-bottom:1px solid #eee}
.pad-name{font-size:12px;font-weight:700;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pad-opts{display:flex;gap:2px}
.pad-opts .opt{flex:1;min-width:0}
.pad-opts .opt input{display:none}
.pad-opts .opt span{display:block;text-align:center;padding:8px 0;font-size:12px;border:1px solid #ccc;border-radius:5px;cursor:pointer;background:#fafafa}
.pad-guide{font-size:11px;color:#555;background:#f2f8f4;border-left:3px solid #1e8449;padding:7px 9px;margin:0 0 10px;line-height:1.6}
.pad-opts .opt input:checked + span{background:#1e8449;color:#fff;border-color:#1e8449;font-weight:700}
.pad-note{font-size:11px;color:#777;margin:6px 0 10px;line-height:1.5}
.action-bar{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;align-items:flex-start}
.action-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.action-btn{background:#1a5c3a;color:#fff;border:none;border-radius:6px;padding:8px 12px;font-size:11px;font-weight:700;white-space:nowrap;cursor:pointer;width:100%}
.action-btn:active{background:#0d3d25}
.action-btn:disabled{background:#95a5a6}
.action-sub{font-size:9px;color:#888;margin-top:3px;white-space:nowrap;pointer-events:none}
/* ナビ */
.nav-bar{display:flex;background:var(--g1);padding:0 12px;border-bottom:2px solid var(--gold)}
.nav-btn{flex:1;padding:8px 0;background:transparent;border:none;color:rgba(255,255,255,0.6);font-size:13px;font-weight:700;cursor:pointer}
.nav-btn.on{color:var(--gold2);border-bottom:2px solid var(--gold2)}
/* 成績ページ */
.stat-card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:14px;margin-bottom:10px}
.stat-title{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #f0ece4;font-size:13px}
.stat-row:last-child{border-bottom:none}
.stat-key{color:var(--sub)}
.stat-val{font-weight:700;color:var(--g1)}
.stat-val.pos{color:#27ae60}
.stat-val.neg{color:#c0392b}
/* ROIバー */
.roi-bar-wrap{margin:4px 0 2px;height:8px;background:#eee;border-radius:4px;overflow:hidden}
.roi-bar{height:100%;border-radius:4px;background:var(--g2)}
.roi-bar.neg{background:#e74c3c}
/* RL精度グリッド */
.rl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:4px}
.rl-cell{background:#f8f6f0;border-radius:8px;padding:8px;text-align:center}
.rl-cell-label{font-size:10px;color:var(--sub);margin-bottom:2px}
.rl-cell-val{font-size:20px;font-weight:900;color:var(--g1)}
/* 直近レース表 */
.rtbl{width:100%;font-size:11px;border-collapse:collapse}
.rtbl th{background:var(--g1);color:#fff;padding:5px 3px;font-size:10px;font-weight:700}
.rtbl td{padding:4px 3px;border-bottom:1px solid #f0ece4;text-align:center}
.rtbl tr.hit td{background:rgba(39,174,96,0.08)}
.rtbl .miss{color:#bbb}
.hit-mark{color:#27ae60;font-weight:800}
.miss-mark{color:#e74c3c}
</style>
</head>
<body>
<div class="hdr">
  <div><div class="hdr-logo">KEIBA-AI</div><div class="hdr-sub">AI RACING PREDICTION</div></div>
  <div class="hdr-right"><div class="hdr-date" id="hdate">読込中...</div><div class="hdr-venues" id="hvenues">---</div></div>
</div>
<div class="nav-bar">
  <button class="nav-btn on" id="nav-predict" onclick="switchPage('predict')">🏇 予想</button>
  <button class="nav-btn" id="nav-stats" onclick="switchPage('stats')">📊 成績</button>
</div>
<div class="action-bar">
  <div class="action-wrap">
    <button class="action-btn" onclick="triggerAction('friday-predict')">📅 土曜レース予想</button>
    <span class="action-sub">金曜夜〜土曜朝に実行</span>
  </div>
  <div class="action-wrap">
    <button class="action-btn" onclick="triggerAction('weekend','saturday')">📋 土曜結果取得＋日曜レース予想</button>
    <span class="action-sub">土曜夜に実行</span>
  </div>
  <div class="action-wrap">
    <button class="action-btn" onclick="triggerAction('sunday-results')">📋 日曜結果取得</button>
    <span class="action-sub">日曜夜に実行</span>
  </div>
</div>
<div class="bias"><span class="bias-txt" id="bias-txt">バイアス読込中...</span><span class="bias-tag" id="bias-tag">-</span></div>
<div class="tabs" id="tabs"></div>
<div id="pwa-hint" style="display:none" class="pwa">
  <span>📱 ホーム画面に追加して使えます（Safari→共有→ホーム画面に追加）</span>
  <button onclick="this.parentElement.style.display='none'">✕</button>
</div>
<div id="page-predict">
<div id="dq-warning"></div>
<div id="result-area"></div>
<div class="summary" id="summary"></div>
<div class="list" id="race-list"></div>
</div>
<div id="page-stats" style="display:none;padding:8px 10px 90px"></div>
<div class="btm">
  <div class="btm-item"><div class="btm-lbl">推定投資</div><div class="btm-val" id="b-inv">-</div></div>
  <div class="btm-item"><div class="btm-lbl">推奨レース</div><div class="btm-val" id="b-rec">-</div></div>
  <div class="btm-item" title="実際に記録した買い目の確定回収率（予測ではありません）"><div class="btm-lbl" id="b-roi-lbl">実績ROI</div><div class="btm-val" id="b-roi">-</div></div>
</div>
<script>
const DATA_URL  = 'https://hanagenuku.github.io/keiba_ai/data/latest.json';
const DATA_URL_FALLBACK = 'https://raw.githubusercontent.com/hanagenuku/keiba_ai/main/data/latest.json';
const STATS_URL = 'https://hanagenuku.github.io/keiba_ai/data/stats.json';
const STATS_URL_FALLBACK = 'https://raw.githubusercontent.com/hanagenuku/keiba_ai/main/data/stats.json';
const GAS_URL   = 'https://script.google.com/macros/s/AKfycbxcpXYNxHPS4wFmnX-EOyWaTU8AKt1ZQhJAL6dz5sTeEWoR319EfCqqDB0B1NHTHAYW/exec';
const EV_BUY_THRESHOLD = 1.3;
const BET_AMOUNT_REN  = 500;

async function loadData(preferRaw) {
  document.getElementById('race-list').innerHTML = '<div class="loading"><div class="loading-spin">🏇</div><div>予想データを読み込み中...</div></div>';
  if (!DATA_URL) { document.getElementById('hdate').textContent='未設定'; return; }
  const primary   = preferRaw ? DATA_URL_FALLBACK : DATA_URL;
  const secondary = preferRaw ? DATA_URL : DATA_URL_FALLBACK;
  const bustUrl = primary + '?t=' + Date.now();
  try {
    let res = await fetch(bustUrl, { cache: 'no-store' });
    if (!res.ok) {
      res = await fetch(secondary + '?t=' + Date.now(), { cache: 'no-store' });
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    D = await res.json();
    initApp();
  } catch(e) {
    document.getElementById('race-list').innerHTML = '<div class="error-box">⚠️ <strong>データ読み込みエラー</strong><br><br>' + e.message + '<br><br><strong>確認事項:</strong><br>• Colabで予想生成を実行済みか<br><br><button class="reload-btn" onclick="loadData()" style="margin:8px 0 0">再読み込み</button></div>';
    document.getElementById('hdate').textContent = 'エラー';
  }
}

function initApp() {
  document.getElementById('hdate').textContent = D.date || '---';
  document.getElementById('hvenues').textContent = (D.venues||[]).join(' · ');
  document.getElementById('bias-txt').textContent = D.bias?.txt || 'フラット';
  document.getElementById('bias-tag').textContent = D.bias?.tag || '-';
  document.getElementById('b-inv').textContent = '¥'+(D.stats?.invest||0).toLocaleString();
  document.getElementById('b-rec').textContent = (D.stats?.rec||0)+'R';
  // ⚠ D.stats.roi は使わないこと。以前ここに固定値150が入っており
  // 「ROI予測 ~150%」と表示され続けていた（実測は通算47.4%）。
  // 実際に決済済みの買い目から集計した確定値を stats.json から読む。
  _fillActualRoi();
  const dq = D.data_quality || {};
  const dqParts = [];
  if (dq.odds_coverage != null && dq.odds_coverage < 0.5) {
    dqParts.push('⚠ 直前オッズ取得率 ' + Math.round(dq.odds_coverage * 100) + '%（オッズ未反映のまま予想が生成された可能性）');
  }
  if ((dq.parse_failures || []).length > 0) {
    const dqList = dq.parse_failures.map(f => f.racecourse + 'R' + f.race_num + '(' + f.reason + ')').join('、');
    dqParts.push('⚠ 取得失敗レース: ' + dqList);
  }
  document.getElementById('dq-warning').innerHTML = dqParts.length
    ? '<div class="dq-warn-box">' + dqParts.join('<br>') + '</div>' : '';
  const ra = document.getElementById('result-area');
  if (D.result) {
    const r = D.result;
    ra.innerHTML = '<div class="result-banner '+(r.recovered>=r.invested?'hit':'')+'"><div class="rb-title">📊 前日の結果</div><div class="rb-stats">的中: '+r.hit+'/'+r.total+'点　回収: ¥'+(r.recovered||0).toLocaleString()+'</div><div class="rb-roi">投資: ¥'+(r.invested||0).toLocaleString()+'　ROI: '+r.roi+'%</div></div>';
  } else { ra.innerHTML=''; }
  const allRaces = Object.values(D.races||{}).flat();
  const recCount = allRaces.filter(r=>r.rec).length;
  document.getElementById('summary').innerHTML = '<div class="sum-card"><div class="sum-label">推奨レース</div><div class="sum-val gold">'+recCount+'R</div></div><div class="sum-card"><div class="sum-label">全会場</div><div class="sum-val">'+(D.venues||[]).length+'場</div></div><div class="sum-card"><div class="sum-label">推定投資</div><div class="sum-val">¥'+(D.stats?.invest||0).toLocaleString()+'</div></div>';
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  (D.venues||[]).forEach((v,i) => {
    const btn = document.createElement('button');
    btn.className = 'tab'+(i===0?' on':'');
    btn.textContent = v;
    btn.onclick = () => switchVenue(v, btn);
    tabs.appendChild(btn);

  venue = (D.venues||[])[0] || null;
  render();
  if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !window.navigator.standalone)
    document.getElementById('pwa-hint').style.display = 'flex';
}

// ── 自分でつける印（端末内だけに保存。サーバには送らない）──────────────
// タップするたび ◎ → ○ → ▲ → △ → ✕ → 無印 と一周する。
// AIの評価とは完全に独立（AI本命の◎は番号列に出るので色で区別している）。
const UMARKS = ['◎','○','▲','△','✕'];
const UMARK_KEY = 'keiba_user_marks_v1';
const UMARK_KEEP_DAYS = 90;

function _umarkPrune(m) {
  // race_id は先頭8桁が YYYYMMDD。古い開催分は捨てて肥大化を防ぐ。
  const cut = new Date(Date.now() - UMARK_KEEP_DAYS*86400000);
  const cutStr = cut.getFullYear()
    + String(cut.getMonth()+1).padStart(2,'0')
    + String(cut.getDate()).padStart(2,'0');
  for (const rid of Object.keys(m)) {
    const d = String(rid).slice(0,8);
    if (/^\d{8}$/.test(d) && d < cutStr) delete m[rid];
  }
  return m;
}

function _umarkLoad() {
  try { return _umarkPrune(JSON.parse(localStorage.getItem(UMARK_KEY)) || {}); }
  catch (e) { return {}; }
}
function _umarkSave() {
  try { localStorage.setItem(UMARK_KEY, JSON.stringify(USER_MARKS)); } catch (e) {}
}
let USER_MARKS = _umarkLoad();

// race_id が無いデータでも印を保てるようにフォールバックキーを作る
function umarkRaceKey(race) {
  return race.race_id || ((D && D.date ? D.date : '') + '_' + venue + '_' + race.r);
}
function getUserMark(rid, n) {
  return (USER_MARKS[rid] || {})[n] || '';
}
function cycleUserMark(rid, n, el) {
  const i = UMARKS.indexOf(getUserMark(rid, n));
  const next = i < 0 ? UMARKS[0] : (i + 1 >= UMARKS.length ? '' : UMARKS[i + 1]);
  if (!USER_MARKS[rid]) USER_MARKS[rid] = {};
  if (next) USER_MARKS[rid][n] = next; else delete USER_MARKS[rid][n];
  if (!Object.keys(USER_MARKS[rid]).length) delete USER_MARKS[rid];
  _umarkSave();
  // 全体を再描画すると画面が跳ねるので、押されたセルだけ書き換える
  el.textContent = next;
  el.className = 'umark' + (next ? ' umark-on' : '');
}
function clearUserMarks(rid) {
  if (!USER_MARKS[rid]) { alert('このレースにはまだ印がありません'); return; }
  if (!confirm('このレースの印を全部消しますか？')) return;
  delete USER_MARKS[rid];
  _umarkSave();
  // data-rid で対象レースの分だけに絞れるので、コンテナを辿る必要はない
  document.querySelectorAll('.umark[data-rid="'+rid+'"]').forEach(el => {
    el.textContent = ''; el.className = 'umark';
  });
}

function findRace(raceKey) {
  for (const v of Object.keys(D.races || {})) {
    for (const r of D.races[v]) {
      if (v + r.r === raceKey) return r;
    }
  }
  return null;
}

let _pollingTimer = null;
const _POLL_KEY = 'keiba_polling';

const STATUS_URL = 'https://hanagenuku.github.io/keiba_ai/data/workflow_status.json';
const STATUS_URL_FALLBACK = 'https://raw.githubusercontent.com/hanagenuku/keiba_ai/main/data/workflow_status.json';

async function _getLatestTimestamp() {
  try {
    // raw.githubusercontent.com はCDNキャッシュが短いのでポーリング時はこちらを優先
    let res = await fetch(DATA_URL_FALLBACK + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) res = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return null;
    const j = await res.json();
    return j.generated_at || j.date || null;
  } catch(_) { return null; }
}

async function _getWorkflowStatus(startTime) {
  try {
    // raw.githubusercontent.com はCDNキャッシュが短いのでポーリング時はこちらを優先
    let res = await fetch(STATUS_URL_FALLBACK + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) res = await fetch(STATUS_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return null;
    const j = await res.json();
    // 今回のトリガー後に書かれたステータスのみ有効
    const updatedAt = new Date(j.updated_at).getTime();
    if (updatedAt < startTime) return null;
    return j.status; // 'success' or 'failure'
  } catch(_) { return null; }
}

let _pollWakeHandler = null;

function _stopPolling(btn, origText) {
  clearInterval(_pollingTimer);
  _pollingTimer = null;
  if (_pollWakeHandler) {
    document.removeEventListener('visibilitychange', _pollWakeHandler);
    window.removeEventListener('focus', _pollWakeHandler);
    window.removeEventListener('online', _pollWakeHandler);
    _pollWakeHandler = null;
  }
  localStorage.removeItem(_POLL_KEY);
  if (btn) { btn.textContent = origText; }
  document.querySelectorAll('.action-btn').forEach(b => b.disabled = false);
  _triggerGuard = false;
}

function _showWorkflowError() {
  document.getElementById('race-list').innerHTML =
    '<div class="error-box">❌ <strong>実行中にエラーが発生しました</strong><br><br>' +
    'GitHub Actions でエラーが起きました。<br>' +
    '<a href="https://github.com/hanagenuku/keiba_ai/actions" target="_blank" style="color:#e74c3c">→ エラーログを確認する</a><br><br>' +
    '<button class="reload-btn" onclick="loadData()" style="margin:8px 0 0">再読み込み</button></div>';
}

function _startPolling(btn, origText, baselineTs, startTime = Date.now()) {
  const MAX_WAIT = 35 * 60;
  const CHECK_INTERVAL_MS = 30 * 1000;
  let lastCheck = 0;
  let inflight = null;   // 同時に何本も投げないための共有Promise

  // localStorage に保存（ページ再読み込み後も復元できるように）
  localStorage.setItem(_POLL_KEY, JSON.stringify({ baselineTs, startTime, origText }));

  // 完了を検出できたら true。検出できなければ false。
  function checkOnce() {
    if (inflight) return inflight;   // 実行中なら同じ結果を待つ（重複fetch防止）
    inflight = (async () => {
      const [ts, wfStatus] = await Promise.all([
        _getLatestTimestamp(),
        _getWorkflowStatus(startTime),
      ]);
      lastCheck = Date.now();
      // ⚠ データが実際に更新されたことを最優先で見る。
      // 同じボタンで2本走って片方だけ失敗する場合があり、
      // status だけ見ていると成功したのにエラー表示になる。
      if (ts && ts !== baselineTs) {
        _stopPolling(btn, origText);
        await loadData(true);
        return true;
      }
      if (wfStatus === 'success') {
        _stopPolling(btn, origText);
        await loadData(true);
        return true;
      }
      if (wfStatus === 'failure') {
        _stopPolling(btn, origText);
        _showWorkflowError();
        return true;
      }
      return false;
    })();
    return inflight.finally(() => { inflight = null; });
  }

  // アプリに戻ってきた・回線が復帰した瞬間に即確認する。
  // スマホはバックグラウンドでタイマーを止めるので、これが無いと
  // 画面を消している間に完了しても復帰時まで気づけない。
  _pollWakeHandler = () => {
    if (!_pollingTimer) return;
    if (document.visibilityState === 'hidden') return;
    checkOnce();
  };
  document.addEventListener('visibilitychange', _pollWakeHandler);
  window.addEventListener('focus', _pollWakeHandler);
  window.addEventListener('online', _pollWakeHandler);

  _pollingTimer = setInterval(async () => {
    const now = Date.now();
    const elapsed = Math.floor((now - startTime) / 1000);
    const mins = Math.floor(elapsed / 60);
    const secs = elapsed % 60;
    if (btn) btn.textContent = `実行中... ${mins}:${String(secs).padStart(2,'0')}`;

    // ⚠ elapsed % 30 のような剰余判定にしないこと。
    // スマホがタイマーを間引くと elapsed が飛び、判定窓を丸ごと跨いで
    // 一度もチェックされないまま35分経つ（2026-08-07に実際に発生）。
    if (now - lastCheck >= CHECK_INTERVAL_MS) {
      lastCheck = now;                       // 応答待ちの間に再突入させない
      if (await checkOnce()) return;
    }

    if (elapsed >= MAX_WAIT) {
      clearInterval(_pollingTimer);          // 以降ティックさせない
      _pollingTimer = null;
      // ⚠ 諦める前に必ずもう一度確認する。
      // バックグラウンドで止まっていたページが35分後に復帰すると、
      // 最初のティックがいきなりここへ来る。確認せずに諦めると
      // 「取得できません」と出たのに実際は成功している、という
      // 一番わかりにくい失敗になる（2026-08-07にユーザー報告）。
      if (await checkOnce()) return;
      _stopPolling(btn, origText);
      alert('⚠️ 35分経過しましたが完了を確認できませんでした。\nページを手動で更新してください。');
    }
  }, 1000);
}

// ページ読み込み時に実行中のポーリングを復元
async function _restorePolling() {
  const saved = localStorage.getItem(_POLL_KEY);
  if (!saved) return;
  try {
    const { baselineTs, startTime, origText } = JSON.parse(saved);
    const elapsed = Math.floor((Date.now() - startTime) / 1000);

    // ⚠ 時間切れでも「まず結果を確認してから」捨てること。
    // 先に localStorage を消して return すると、実際は成功していても
    // 何も知らせないまま実行中の表示だけが消える。
    const [ts, wfStatus] = await Promise.all([
      _getLatestTimestamp(),
      _getWorkflowStatus(startTime),
    ]);
    if ((ts && ts !== baselineTs) || wfStatus === 'success') {
      localStorage.removeItem(_POLL_KEY);
      await loadData(true);
      return;
    }
    if (wfStatus === 'failure') {
      localStorage.removeItem(_POLL_KEY);
      _showWorkflowError();
      return;
    }
    if (elapsed >= 35 * 60) { localStorage.removeItem(_POLL_KEY); return; }

    // まだ実行中 → 押されたボタンを探して復元
    const btn = [...document.querySelectorAll('.action-btn')].find(b => b.textContent === origText)
              || document.querySelector('.action-btn');
    if (btn) {
      btn.disabled = true;
      _startPolling(btn, origText, baselineTs, startTime);
    }
  } catch(_) { localStorage.removeItem(_POLL_KEY); }
}

let _triggerGuard = false;
async function triggerAction(workflow, mode) {
  if (_triggerGuard) return;
  _triggerGuard = true;

  const btn = event.currentTarget || event.target.closest('.action-btn') || event.target;
  btn.disabled = true;
  document.querySelectorAll('.action-btn').forEach(b => b.disabled = true);
  const origText = btn.textContent;
  btn.textContent = '実行中... 0:00';

  const baselineTs = await _getLatestTimestamp();
  const startTime = Date.now();

  try {
    let url = GAS_URL + '?action=trigger&workflow=' + workflow;
    if (mode) url += '&mode=' + mode;

    const res = await fetch(url, {redirect:'follow'});
    const data = await res.json();

    if (data.status === 'ok') {
      _startPolling(btn, origText, baselineTs, startTime);
    } else {
      alert('❌ エラー: ' + (data.message || JSON.stringify(data)));
      btn.textContent = origText;
      document.querySelectorAll('.action-btn').forEach(b => b.disabled = false);
      _triggerGuard = false;
    }
  } catch(err) {
    alert('❌ 通信エラー: ' + err.message);
    btn.textContent = origText;
    document.querySelectorAll('.action-btn').forEach(b => b.disabled = false);
    _triggerGuard = false;
  }
}

async function fetchFreshOdds(raceKey, btn) {
  const now = Date.now();
  if (oddsCooldown[raceKey] && now - oddsCooldown[raceKey] < 5000) return;
  oddsCooldown[raceKey] = now;

  const race = findRace(raceKey);
  if (!race || !race.race_id) {
    alert('レースIDが見つかりません');
    return;
  }

  const origLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = '取得中...';

  try {
    let url = GAS_URL + '?action=getOdds&race_id=' + encodeURIComponent(race.race_id);
    if (race.odds_cn) url += '&cn=' + encodeURIComponent(race.odds_cn);
    let data;
    const res = await fetch(url, {redirect:'follow'});
    data = await res.json();

    if (data.status !== 'ok') throw new Error(data.message || 'オッズ取得失敗');
    if (!data.odds || Object.keys(data.odds).length === 0) throw new Error('オッズ未取得(cn='+race.odds_cn+')');

    if (!race._morning_bets) {
      race._morning_bets = JSON.parse(JSON.stringify(race.bets || []));
      race._morning_ev = {};
      race._morning_rec = race.rec;
      for (const h of (race.horses || [])) {
        race._morning_ev[h.n] = h.ev;
        h._morning_odds = h.odds || null;
        h._morning_pop = h.pop != null ? h.pop : null;
      }
    }
    updateOddsAndEV(race, data.odds || {});
    updateRecFlag(race);
    const rawBets = recalcBets(race);
    race._change_type = classifyChange(race._morning_bets, rawBets);

    const horsesMap = {};
    for (const h of (race.horses || [])) horsesMap[h.n] = h;
    race._new_bets_raw = rawBets;
    race.bets = rawBets.map(b => betToDisplay(b, horsesMap));
    race._update_time = data.updated_at;
    // ⚠ 軸1頭ベース買い目（gumbel_bets）はここでは作り直さない。
    //   従来はクライアント側 recalcGumbelBets() が丸ごと作り直していたが、
    //   ①サーバ側(axis_bets.py)とロジックが二重になって実際に食い違った
    //     （2026-08-09: サーバは軸#12のフォーメーション13点＋ワイド3点＋馬連8点を
    //      出していたのに、ボタンを押すとRL1-5ボックス10点に置き換わっていた）
    //   ②選別の根拠にしていたEVが壊れていた（三連複のEVは cal_prob＝複勝確率を
    //     単勝勝率の位置に入れており、「確率」が3.5を超えていた。単勝・馬連では
    //     2026-07-24に直したが三連複だけ直し忘れていた）
    //   ③そもそもEVによる買い目選別は2026-07-05・07-30の2回とも否定されている
    //   よってオッズ・勝率・複勝率の表示だけ更新し、買い目はサーバの結果を保つ。
    race._odds_refreshed = true;

    redrawRace(raceKey, race);
  } catch (err) {
    alert('オッズ取得エラー: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = origLabel;
  }
}

// ── 勝率・複勝率の再同期用ヘルパー（2026-07-26セッション） ──────────────
// 直前オッズ取得ボタンは従来オッズだけを更新し、勝率(tan_pct)は予想生成時点の
// まま据え置いていた。生成後に市場が動くと「勝率は生成時点の古い人気のまま・
// オッズだけ新しい」という時点のずれたEVが表示される構造的な問題があった。
// 残差学習モデルのability_margin（市場非依存のAI能力スコア）は現在の人気に
// 依存しないため、新しい人気順位からbase_marginだけ引き直して安全に
// 勝率を再計算できる。式はsrc/features/engine.py・src/models/predict.pyの
// Python実装と完全に一致させること（乖離するとここが新たなバグの温床になる）。

function _baseMarginFromPopularity(pop, nHorses) {
  const n = Math.max(nHorses, 2);
  const harm = Math.log(n) + 0.5772;
  const pMkt = Math.max(Math.min((1.0 / Math.max(pop, 1)) / harm, 0.999), 0.001);
  return Math.log(pMkt / (1 - pMkt));
}

// 実オッズの大きさからアンカーを作る。レース内で Σ(1/オッズ)=1 に正規化するので
// 控除率は自動的に落ちる。scripts/eval_odds_anchor.py の _odds_to_base_margin と
// 同じ計算（Python側とJS側で値が一致することをテストで固定している）。
//
// なぜ順位(Zipf近似)ではなくこれを使うか:
//   2026-08-25 に3,940レース・53,715頭で測ると、直前オッズを押した時点で
//   人気順位アンカー AUC 0.8226 → 実オッズアンカー 0.8292（+0.0066・3窓とも同符号）。
//   ⚠ 事前登録の基準②（平均+0.01以上）は未達。ユーザーの判断で採用した。
//   ⚠ これは「当たりやすさ」であって回収率ではない（North Star #9）。
function _baseMarginFromOdds(oddsList) {
  const inv = oddsList.map(o => 1.0 / o);
  const s = inv.reduce((a, b) => a + b, 0);
  return inv.map(v => {
    const p = Math.max(Math.min(v / s, 0.999), 0.001);
    return Math.log(p / (1 - p));
  });
}

// 単勝オッズ盤として成立しているか。engine.py の _sanitize_odds_book と同じ判定。
// 控除率20%なら Σ(1/オッズ)≈1.25。2026-08-15 には全16頭が2.1倍という盤が来て
// おり、1頭ずつ見ても異常に見えないが Σ では一発で分かる。
// 🔴 壊れた盤で「大きさ」を使うと順位を使うより悪くなるので、必ず先に検査する。
const MAX_VALID_ODDS_BOOK_SUM = 1.65;
const MIN_HORSES_FOR_BOOK_CHECK = 3;
function _oddsBookIsUsable(oddsList) {
  if (oddsList.length < MIN_HORSES_FOR_BOOK_CHECK) return false;
  if (!oddsList.every(o => typeof o === 'number' && o >= 1.0)) return false;
  const book = oddsList.reduce((a, o) => a + 1.0 / o, 0);
  return book <= MAX_VALID_ODDS_BOOK_SUM;
}

// 🔴 オッズも人気も無いレース用の中立な土台。engine.py の _flat_base_margin と同じ。
//    全馬に同じ値を渡すと市場の寄与が順位に効かなくなり、順位は
//    ability_margin（市場を見ないAIの評価）だけで決まる。
//    サーバ側が「馬番順を人気とみなす」捏造をしていた頃は AUC 0.78→0.66 に落ちていた。
function _flatBaseMargin(n) {
  const k = Math.max(n, 2);
  let sum = 0;
  for (let i = 1; i <= k; i++) sum += _baseMarginFromPopularity(i, k);
  return sum / k;
}

function _softmaxTotals(totals, temperature) {
  const maxT = Math.max(...totals);
  const exps = totals.map(t => Math.exp((t - maxT) / temperature));
  const s = exps.reduce((a, b) => a + b, 0);
  return exps.map(e => e / s);
}

function _harvilleTop3(winProbs) {
  const n = winProbs.length;
  const ps = winProbs.map(p => Math.max(1e-9, p));
  const top2 = [];
  for (let i = 0; i < n; i++) {
    let v = ps[i];
    for (let j = 0; j < n; j++) {
      if (j === i) continue;
      const dj = 1.0 - ps[j];
      if (dj > 1e-9) v += ps[j] * ps[i] / dj;
    }
    top2.push(Math.min(1.0, v));
  }
  if (n < 3) return top2.map(t => [t, t]);
  const top3 = [];
  for (let i = 0; i < n; i++) {
    let v = top2[i];
    for (let j = 0; j < n; j++) {
      if (j === i) continue;
      const dj = 1.0 - ps[j];
      if (dj < 1e-9) continue;
      for (let k = 0; k < n; k++) {
        if (k === i || k === j) continue;
        const djk = 1.0 - ps[j] - ps[k];
        if (djk < 1e-9) continue;
        v += ps[j] * (ps[k] / dj) * (ps[i] / djk);
      }
    }
    top3.push(Math.min(1.0, v));
  }
  return top2.map((t2, i) => [t2, top3[i]]);
}

function updateOddsAndEV(race, freshOdds) {
  for (const h of (race.horses || [])) {
    const od = freshOdds[String(h.n)];
    if (od && od.tansho) {
      h.odds = od.tansho;
      h.tansho_odds  = od.tansho;
    }
    if (od && od.fukusho) {
      h.fukusho_odds = od.fukusho;
    }
    // 人気急上昇検出: 朝オッズ→直前オッズの下落率
    h._odds_surge = null;
    if (h._morning_odds && h._morning_odds > 0 && h.odds && h.odds > 0) {
      const dropRate = (h._morning_odds - h.odds) / h._morning_odds;
      // 30%以上下落 かつ 3倍以上変動（1.0→0.9程度の微変動は除外）
      if (dropRate >= 0.30 && (h._morning_odds - h.odds) >= 3.0) {
        h._odds_surge = 'hot';
      } else if (dropRate >= 0.20 && (h._morning_odds - h.odds) >= 2.0) {
        h._odds_surge = 'warm';
      }
    }
  }
  const ranked = (race.horses || []).filter(h => h.odds != null && h.odds > 0);
  ranked.sort((a, b) => a.odds - b.odds);
  ranked.forEach((h, i) => { h.pop = i + 1; });

  // 残差学習モデル（全馬にability_marginがある場合）のみ勝率・複勝率を再同期する。
  // 一部の馬だけ欠けている場合はレース全体で再同期をスキップし、
  // 従来通り（勝率は生成時点のまま・オッズだけ更新）にフォールバックする。
  const allHorses = race.horses || [];
  const hasAbility = allHorses.length > 0 && allHorses.every(h => h.ability_margin != null);
  if (hasAbility) {
    const n = allHorses.length;
    // 全馬にまともなオッズが揃い、盤としても成立しているときだけ「大きさ」を使う。
    // 欠損があると正規化が狂い、壊れた盤だと順位より悪くなるので、
    // どちらの場合も従来どおり人気順位(Zipf近似)へ落とす。
    const oddsList = allHorses.map(h => h.odds);
    const useOdds = _oddsBookIsUsable(oddsList);
    // 人気が1つも分からないなら、順位を捏造せず中立な土台にする。
    // （サーバ側 engine.py の _market_anchor='flat' と同じ扱い）
    const hasPop = allHorses.some(h => h.pop > 0 && h.pop < 99);
    let bms, anchor;
    if (useOdds)      { bms = _baseMarginFromOdds(oddsList); anchor = 'odds'; }
    else if (hasPop)  { bms = allHorses.map(h => _baseMarginFromPopularity(h.pop || n, n));
                        anchor = 'rank'; }
    else              { const f = _flatBaseMargin(n); bms = allHorses.map(() => f);
                        anchor = 'flat'; }
    race._anchor = anchor;
    const totals = allHorses.map((h, i) => {
      const rawProb = 1 / (1 + Math.exp(-(h.ability_margin + bms[i])));
      return rawProb * 10;
    });
    const winProbs = _softmaxTotals(totals, 3.5);
    const top3s = _harvilleTop3(winProbs);
    allHorses.forEach((h, i) => {
      h.tan_pct  = Math.round(Math.min(60, winProbs[i] * 100) * 10) / 10;
      h.fuku_pct = Math.round(top3s[i][1] * 100 * 10) / 10;
    });

    // RL順位は「勝率の順位」そのもの。engine.py の calc_all() 末尾で
    //   for i, h in enumerate(sorted(out, key=win_prob, reverse=True)): h['rl_rank'] = i+1
    // と付け直している（calc_rl_cl_ranks の rl_raw は上書きされて使われない）。
    // 勝率を再計算したらRL順位も振り直さないと、RL1の勝率がRL2より低いという
    // 矛盾した表示になり、乖離バッジ・買い目候補・AI強気ペアまで狂う。
    allHorses.forEach(h => { if (h._morning_rl == null) h._morning_rl = h.rl_rank; });
    allHorses.slice()
      .sort((a, b) => (b.tan_pct || 0) - (a.tan_pct || 0))
      .forEach((h, i) => { h.rl_rank = i + 1; });
  }

  for (const h of allHorses) {
    h.ev = (h.odds && h.odds > 0 && h.tan_pct != null)
         ? Math.round((h.tan_pct / 100) * h.odds * 1000) / 1000
         : null;
  }

  // AI強気ペアは「市場人気 vs AI順位」で決まるので、人気が変われば選び直す必要がある。
  // rl_rank はルールベース特徴量から算出され市場に依存しないため据え置きでよい。
  recalcAiPairBets(race);
}

// ── AI強気ペア(A×D)の選び直し ─────────────────────────────────────────
// サーバ側 src/betting/ai_pair_bets.py と同じ規則。ズレると表の乖離バッジと
// 推奨が食い違うので、条件を変えるときは必ず両方直すこと。
const APB_AXIS_POP_MIN = 4, APB_AXIS_POP_MAX = 6, APB_PARTNER_POP_MIN = 7;

function _apbClassify(h) {
  const pop = h.pop, ai = h.rl_rank;
  if (!(pop >= 1 && pop <= 18) || !(ai >= 1 && ai <= 18)) return null;
  if (ai >= pop) return null;                       // AI強気でなければ対象外
  if (pop >= APB_AXIS_POP_MIN && pop <= APB_AXIS_POP_MAX) return 'A';
  if (pop >= APB_PARTNER_POP_MIN) return 'D';
  return null;
}

function recalcAiPairBets(race) {
  const prev = race.ai_pair_bets;
  if (!prev) return;                                 // 元々出ていなければ何もしない
  const axis = [], partners = [];
  for (const h of (race.horses || [])) {
    const g = _apbClassify(h);
    if (g === 'A') axis.push(h); else if (g === 'D') partners.push(h);
  }
  if (!axis.length || !partners.length) {
    // 条件を満たす馬が居なくなったら推奨を消す（古い組を残さない）
    race.ai_pair_bets = null;
    return;
  }
  // 各群のAI最上位1頭ずつ（検証で的中率が最も高かった構成）
  axis.sort((a, b) => a.rl_rank - b.rl_rank);
  partners.sort((a, b) => a.rl_rank - b.rl_rank);
  const a = axis[0], p = partners[0];
  const pair = {
    // 馬連・ワイドは順不同。サーバ側・配当照合と同じく昇順に正規化する
    nums: [a.n, p.n].sort((x, y) => x - y),
    axis_num: a.n, axis_pop: a.pop, axis_ai: a.rl_rank,
    partner_num: p.n, partner_pop: p.pop, partner_ai: p.rl_rank,
  };
  race.ai_pair_bets = {
    umaren: [pair], wide: [pair],
    axis: [a.n], partners: [p.n],
    unverified: true, measured: prev.measured,
  };
}

function updateRecFlag(race) {
  // RL1のEVが直前オッズで大きく変動した場合に推奨フラグを更新
  const horses = (race.horses || []).slice()
    .filter(h => h.odds > 0)
    .sort((a, b) => (a.rl_rank || 99) - (b.rl_rank || 99));
  if (horses.length === 0) return;
  const rl1 = horses[0];
  const rl1Ev = rl1.ev || 0;
  const rl1Odds = rl1.tansho_odds || rl1.odds || 0;
  const wasRec = race._morning_rec != null ? race._morning_rec : race.rec;

  // 推奨外し: RL1のオッズが1.5倍未満（ガチガチ本命＝妙味なし）
  // または RL上位3頭全員のEVが0.8未満（買い目が全滅）
  const rl3Evs = horses.slice(0, 3).map(h => h.ev || 0);
  const allLowEv = rl3Evs.every(ev => ev < 0.8);
  if (wasRec && (rl1Odds < 1.5 || allLowEv)) {
    race.rec = false;
    race._rec_reason = rl1Odds < 1.5
      ? 'RL1が' + rl1Odds.toFixed(1) + '倍（妙味なし）'
      : 'RL上位のEVが低下';
    return;
  }

  // 推奨追加: 元々非推奨だが直前でRL1-3に妙味が出た
  if (!wasRec) {
    const hasValue = horses.slice(0, 3).some(h => {
      const o = h.tansho_odds || h.odds || 0;
      return (h.ev || 0) >= 1.2 && o >= 2.0 && o <= 30.0;
    });
    if (hasValue) {
      race.rec = true;
      race._rec_reason = '直前オッズでRL上位に妙味発生';
      return;
    }
  }
}

function estimatePayout(bet, horsesMap) {
  const getOdds = (n) => {
    const h = horsesMap[n];
    if (!h) return null;
    return h.tansho_odds || h.odds || h.fukusho_odds || null;
  };

  if (bet.type === '複勝') {
    const h = horsesMap[bet.nums[0]];
    if (!h || !h.fukusho_odds) return null;
    return h.fukusho_odds * 100;
  }
  if (bet.type === '馬連') {
    const o1 = getOdds(bet.nums[0]);
    const o2 = getOdds(bet.nums[1]);
    if (!o1 || !o2) return null;
    return Math.max(200, Math.pow(o1 * o2, 0.5) * 75);
  }
  if (bet.type === 'ワイド') {
    const o1 = getOdds(bet.nums[0]);
    const o2 = getOdds(bet.nums[1]);
    if (!o1 || !o2) return null;
    return Math.max(150, Math.pow(o1 * o2, 0.5) * 45);
  }
  if (bet.type === '三連複') {
    const o1 = getOdds(bet.nums[0]);
    const o2 = getOdds(bet.nums[1]);
    const o3 = getOdds(bet.nums[2]);
    if (!o1 || !o2 || !o3) return null;
    return Math.max(300, Math.pow(o1 * o2 * o3, 0.33) * 80);
  }
  return null;
}

function recalcBets(race) {
  const horses = (race.horses || []).slice().sort((a, b) => ((a.rl_rank || 99) - (b.rl_rank || 99)));
  const numHorses = race.num_horses || horses.length;
  const chaosGrade = race.chaos_grade || 'B';
  const hasOdds = horses.some(h => h.fukusho_odds != null);

  const valueHorses = horses.filter(h => h.ev != null && h.ev >= 1.3);

  const top1 = horses[0];
  const top2 = horses[1];
  const top3 = horses[2];
  if (!top1) return [];

  const candidates = [];

  if (numHorses >= 14) {
    if (!top2) {
      candidates.push({type:'複勝', nums:[top1.n], amount:BET_AMOUNT_FUKU,
                 reason:`多頭数(${numHorses}頭)・馬連候補不足→複勝`});
    } else if (chaosGrade === 'C') {
      candidates.push({type:'馬連', nums:[top1.n, top2.n], amount:BET_AMOUNT_REN,
                 reason:`多頭数(${numHorses}頭)+混戦・馬連(RL1×2)`});
      if (top3) {
        candidates.push({type:'三連複', nums:[top1.n, top2.n, top3.n].sort((a,b)=>a-b), amount:BET_AMOUNT_SAN,
                   reason:`多頭数(${numHorses}頭)+混戦・三連複RL1〜3ボックス`});
      }
    } else {
      candidates.push({type:'馬連', nums:[top1.n, top2.n], amount:BET_AMOUNT_REN,
                 reason:`多頭数(${numHorses}頭)・馬連(RL1×2)`});
      candidates.push({type:'ワイド', nums:[top1.n, top2.n], amount:BET_AMOUNT_WIDE,
                 reason:`多頭数(${numHorses}頭)・ワイド(RL1×2)`});
    }
  } else if (numHorses <= 8) {
    if (!top2) {
      candidates.push({type:'複勝', nums:[top1.n], amount:BET_AMOUNT_FUKU,
                 reason:`少頭数(${numHorses}頭)・馬連候補不足→複勝`});
    } else {
      candidates.push({type:'馬連', nums:[top1.n, top2.n], amount:BET_AMOUNT_REN,
                 reason:`少頭数(${numHorses}頭)・馬連(RL1×2)`});
    }
  } else if (chaosGrade === 'A') {
    if (!top2) {
      candidates.push({type:'複勝', nums:[top1.n], amount:BET_AMOUNT_FUKU,
                 reason:`中頭数(${numHorses}頭)+堅い・馬連候補不足→複勝`});
    } else {
      candidates.push({type:'馬連', nums:[top1.n, top2.n], amount:BET_AMOUNT_REN,
                 reason:`中頭数(${numHorses}頭)+堅い・馬連(RL1×2)`});
    }
  } else if (chaosGrade === 'B') {
    if (valueHorses.length > 0) {
      const vh = valueHorses[0];
      candidates.push({type:'複勝', nums:[vh.n], amount:BET_AMOUNT_FUKU,
                 reason:`中頭数(${numHorses}頭)+中荒れ・バリュー馬#${vh.n}複勝`});
      if (vh.n !== top1.n) {
        candidates.push({type:'ワイド', nums:[vh.n, top1.n], amount:BET_AMOUNT_WIDE,
                   reason:`中頭数(${numHorses}頭)+中荒れ・バリュー#${vh.n}×RL1位#${top1.n}ワイド`});
      } else if (top2) {
        candidates.push({type:'ワイド', nums:[vh.n, top2.n], amount:BET_AMOUNT_WIDE,
                   reason:`中頭数(${numHorses}頭)+中荒れ・バリュー#${vh.n}×RL2位#${top2.n}ワイド`});
      }
    } else {
      candidates.push({type:'複勝', nums:[top1.n], amount:BET_AMOUNT_FUKU,
                 reason:`中頭数(${numHorses}頭)+中荒れ・バリューなし→RL1位複勝`});
    }
  } else {
    // chaosGrade === 'C'
    if (valueHorses.length > 0) {
      candidates.push({type:'複勝', nums:[valueHorses[0].n], amount:BET_AMOUNT_SAN,
                 reason:`中頭数(${numHorses}頭)+大荒れ・バリュー馬#${valueHorses[0].n}複勝少額`});
    }
  }

  if (!hasOdds) return candidates;

  const horsesMap = {};
  for (const h of horses) horsesMap[h.n] = h;

  return candidates.filter(bet => {
    const estPay = estimatePayout(bet, horsesMap);
    if (estPay === null) return true;
    return estPay >= bet.amount * EV_THRESHOLD;
  });
}

function extractNums(bet) {
  if (bet.nums) return bet.nums;
  const matches = (bet.horse || '').match(/#(\d+)/g) || [];
  return matches.map(s => parseInt(s.slice(1), 10));
}

function classifyChange(morningBets, newBets) {
  const mLen = morningBets.length;
  const nLen = newBets.length;

  if (mLen === 0 && nLen === 0) return 'no_change';
  if (mLen > 0 && nLen === 0) return 'reduced';
  if (mLen === 0 && nLen > 0) return 'expanded';

  const mNums = new Set(morningBets.flatMap(extractNums));
  const nNums = new Set(newBets.flatMap(extractNums));
  const same = [...mNums].every(n => nNums.has(n)) && [...nNums].every(n => mNums.has(n));

  return same ? 'no_change' : 'swapped';
}

function betToDisplay(bet, horsesMap) {
  const tc = TAG_MAP[bet.type] || 'fuku';
  if (bet.type === '三連複') {
    const nums = bet.nums.slice().sort((a,b)=>a-b);
    return {tag: 'sanfuku', label: '三連複(1点)', trio_type: 'list', nums: nums,
            combos: [nums.join('-')], est: '1点', amt: '¥' + bet.amount};
  }
  const names = bet.nums.map(n => {
    const h = horsesMap[n];
    return '#' + n + ' ' + (h ? h.name : '');
  }).join(' / ');
  let est;
  if (bet.type === '複勝') {
    const h = horsesMap[bet.nums[0]];
    est = (h && h.fukusho_odds) ? h.fukusho_odds.toFixed(1) + '倍' : '-';
  } else {
    const pay = estimatePayout(bet, horsesMap);
    est = pay ? (pay / 100).toFixed(1) + '倍' : '-';
  }
  return {tag: tc, label: bet.type, horse: names, est: est, amt: '¥' + bet.amount};
}

function buildValueChangeDetail(race) {
  if (!race._morning_ev) return '';
  let html = '<div style="font-size:10px;color:#666;padding:2px 0">';
  for (const h of (race.horses || [])) {
    const oldEv = race._morning_ev[h.n];
    const newEv = h.ev;
    if (oldEv != null && newEv != null && Math.abs(newEv - oldEv) >= 0.1) {
      const oldStr = oldEv.toFixed(2);
      const newStr = newEv.toFixed(2);
      const label = newEv >= 1.3 && oldEv < 1.3 ? '（出現！）'
                  : oldEv >= 1.3 && newEv < 1.3 ? '（消滅）' : '';
      html += '  #' + h.n + ' EV: ' + oldStr + ' → ' + newStr + label + '<br>';
    }
  }
  html += '</div>';
  return html;
}

function redrawRace(raceKey, race) {
  render();
}

function formationHtml(f) {
  if (!f) return '';
  const PAT_LABEL = {
    'A_1ax4box':  '軸1頭×4頭BOX',
    'B_standard': '軸1頭×2列×3列',
    'C_2ax5flow': '2頭軸×流し',
    'D_4box':     '4頭BOX',
    'E_1ax6box':  '軸1頭×6頭BOX',
  };
  const patLabel = PAT_LABEL[f.pattern] || 'フォーメーション';
  let h = '<div class="formation-box">';
  h += '<div class="formation-title">三連複 ' + patLabel
     + '（' + f.total_points + '点×¥100=¥' + f.total_amount.toLocaleString() + '）';
  if (f.syn_odds) h += ' <span style="background:#117a65;color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px">合成' + f.syn_odds.toFixed(1) + '倍</span>';
  h += '</div>';

  if (f.axis) {
    const axLabel = f.axis2 ? '軸①' : '軸';
    h += '<div class="formation-row"><span class="row-label axis-label">' + axLabel + '</span>'
       + '<span class="axis-horse">#' + f.axis.num + ' ' + f.axis.name + '（' + f.axis.pop + '番人気）</span></div>';
  }
  if (f.axis2) {
    h += '<div class="formation-row"><span class="row-label axis-label">軸②</span>'
       + '<span class="axis-horse">#' + f.axis2.num + ' ' + f.axis2.name + '（' + f.axis2.pop + '番人気）</span></div>';
  }
  if (f.second_row && f.second_row.length > 0) {
    h += '<div class="formation-row"><span class="row-label second-label">2列</span>'
       + '<span>' + f.second_row.map(x => '#' + x.num + ' ' + x.name).join('、') + '</span></div>';
  }
  if (f.third_row && f.third_row.length > 0) {
    const isBox  = (f.pattern === 'D_4box');
    const isFlow = (f.pattern === 'C_2ax5flow' || (f.pattern === 'E_1ax6box'));
    const rowLbl = isBox ? 'BOX' : (isFlow ? '相手' : '3列');
    h += '<div class="formation-row"><span class="row-label third-label">' + rowLbl + '</span>'
       + '<span>' + f.third_row.map(x => '#' + x.num).join('、') + '</span></div>';
  }
  // Pattern D: axis_numsがないのでthird_rowに全頭入っている（上で表示済み）

  const pr = f.payout_range;
  const tierCount = {};
  for (const b of (f.bets || [])) tierCount[b.tier] = (tierCount[b.tier] || 0) + 1;
  const tierStr = Object.entries(tierCount).map(([k,v]) => k + v + '点').join(' / ');
  h += '<div class="formation-payout">';
  h += '想定配当: ¥' + pr.min.toLocaleString() + '〜¥' + pr.max.toLocaleString();
  if (tierStr) h += '　' + tierStr;
  h += '</div></div>';
  return h;
}

function render() {
  if (!D) return;
  const races = (D.races||{})[venue] || [];
  if (!races.length) { document.getElementById('race-list').innerHTML='<div style="text-align:center;padding:40px;color:var(--sub)">この会場のデータがありません</div>'; return; }
  let html = '';
  for (const race of races) {
    const k = venue+race.r;
  // 自信度バッジ。数字の意味は「軸(RL1)が3着内に入る確率」。
  // ⚠ 当てやすさであって儲けやすさではない（最上位帯でも複勝回収89.3%）。
  //    高いから買う、ではなく低いから見送る、という使い方をする。
  function _confBadge(race) {
    if (race.conf == null) return '';
    const t = '軸が3着内に入る確率 ' + race.conf + '%（当てやすさの目安。'
            + '高くても回収率は控除率を超えません）';
    return '<span class="conf" title="' + t + '">軸3着内 ' + race.conf + '%</span>';
  }

    const isOpen = opened[k];
    const isRec = race.rec;
    // 推奨フラグ変更の表示
    let recLabel = '';
    let nameAlert = '';
    if (isRec) {
      recLabel = _confBadge(race)+'<span class="rec-lbl">★推奨</span>';
    }
    if (race._morning_rec != null && race._morning_rec !== race.rec) {
      if (!race.rec && race._morning_rec) {
        recLabel = '<span style="font-size:9px;color:#c0392b;font-weight:700;background:rgba(192,57,43,0.1);padding:1px 6px;border-radius:3px">推奨取消</span>';
      } else if (race.rec && !race._morning_rec) {
        recLabel = _confBadge(race);
        nameAlert = ' <span class="new-rec-alert">NEW推奨</span>';
      }
    }
    html += '<div class="rc'+(isRec?' rec':'')+'"><div class="rc-head" onclick="toggle(\''+k+'\')"><div class="rc-num">'+race.r+'</div><div class="rc-info"><div class="rc-name">'+race.name+nameAlert+'</div><div class="rc-meta">'+race.dist+'</div></div><div class="rc-right">'+recLabel+'<span class="arr'+(isOpen?' open':'')+'">▼</span></div></div>';
    if (race.honmei) {
      html += '<div class="hstrip" onclick="toggle(\''+k+'\')"><span class="hbadge">◎本命</span><span class="hname">#'+race.honmei.n+' '+race.honmei.name+'</span><span class="hodds">'+(race.honmei.odds||'-')+'倍 / '+(race.honmei.style||'-')+'</span></div>';
    }
    if (isOpen) {
      html += '<div class="detail open"><div class="det-inner"><div class="sec">出走馬・AI評価</div>';
      if (race.chaos_grade) {
        const gradeColor = {A:'#2980b9', B:'#e67e22', C:'#c0392b'}[race.chaos_grade] || '#999';
        const gradeLabel = {A:'堅い', B:'中荒れ', C:'大荒れ'}[race.chaos_grade] || '';
        html += '<div style="padding:0 0 8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">';
        html += '<span style="background:'+gradeColor+';color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:4px">波乱度'+race.chaos_grade+' '+gradeLabel+'</span>';
        if (race.bet_reason) {
          html += '<span style="font-size:11px;color:#666">'+race.bet_reason+'</span>';
        }
        html += '</div>';
      }
      // 直前オッズ変動サマリー（推奨変更・人気急上昇馬）
      if (race._update_time) {
        const surgeHorses = (race.horses || []).filter(h => h._odds_surge === 'hot');
        const warmHorses = (race.horses || []).filter(h => h._odds_surge === 'warm');
        if (surgeHorses.length > 0 || (race._morning_rec != null && race._morning_rec !== race.rec)) {
          html += '<div style="padding:4px 0 8px;font-size:11px;border-left:3px solid #e74c3c;padding-left:8px;margin-bottom:4px">';
          if (race._rec_reason) {
            const rcColor = race.rec ? '#27ae60' : '#c0392b';
            html += '<div style="color:'+rcColor+';font-weight:700">' + (race.rec ? '+ ' : '- ') + race._rec_reason + '</div>';
          }
          if (surgeHorses.length > 0) {
            html += '<div style="color:#e74c3c;font-weight:600">人気急上昇: '
              + surgeHorses.map(h => '#' + h.n + ' ' + h.name + '(' + (h._morning_odds||0).toFixed(1) + '→' + h.odds.toFixed(1) + ')').join(', ')
              + '</div>';
          }
          if (warmHorses.length > 0) {
            html += '<div style="color:#e67e22">上昇傾向: '
              + warmHorses.map(h => '#' + h.n + '(' + (h._morning_odds||0).toFixed(1) + '→' + h.odds.toFixed(1) + ')').join(', ')
              + '</div>';
          }
          html += '</div>';
        }
      }
      const _umRid = umarkRaceKey(race);
      // 「AI単」＝市場（オッズ）を土台から外したAI単独の順位（solo_rank）。
      // 残差学習モデル運用時のみ付与されるため、無いレースでは列ごと出さない。
      const _hasSolo = (race.horses||[]).some(h => h.solo_rank != null);
      const _soloTh = _hasSolo
        ? '<th class="col-rl" style="width:26px" title="市場（オッズ）を土台から外した、AI単独の評価順位。RLは市場を土台にAIが補正した順位で、買い目・軸はRLを使います。AI単は参考表示です（実測では当てる力はRLに劣ります）">AI単</th>'
        : '';
      html += '<table class="htbl"><tr><th class="col-um" title="タップで ◎○▲△✕ を切り替え。端末内だけに保存されます">印</th><th style="width:20px">番</th><th class="col-name">馬名</th><th class="col-pop" style="width:22px">人</th><th class="col-odds" style="width:34px">ｵｯｽﾞ</th><th class="col-mk">特記</th><th class="col-rl" style="width:24px">RL</th>'+_soloTh+'<th style="width:32px">勝率</th><th style="width:32px">複勝</th><th class="col-val" style="width:32px" title="勝率×オッズの参考値。単体では買い目の根拠になりません（下のEV買い目欄を参照）">EV</th></tr>';
      for (const h of (race.horses||[])) {
        const isH = race.honmei && h.n === race.honmei.n;
        const rl = (!h.rl_rank || h.rl_rank >= 99) ? '-' : h.rl_rank;
        const tan = h.tan_pct != null ? h.tan_pct+'%' : '-';
        const fuku = h.fuku_pct != null ? h.fuku_pct+'%' : '-';
        const hi = h.fuku_pct != null && h.fuku_pct >= 38;

        // 人気
        const pop = h.pop != null ? h.pop : '-';

        // オッズ（小数1桁。100倍以上は整数）+ 朝との比較で↑↓
        let oddsStr = '-';
        if (h.odds != null && h.odds !== 0) {
          oddsStr = h.odds >= 100 ? String(Math.round(h.odds)) : h.odds.toFixed(1);
          const morning = h._morning_odds;
          if (morning != null && morning !== 0) {
            if (h.odds < morning - 0.05)      oddsStr += '<span style="color:#e74c3c;font-size:9px">↓</span>';
            else if (h.odds > morning + 0.05) oddsStr += '<span style="color:#27ae60;font-size:9px">↑</span>';
          }
        }
        const odds = oddsStr;

        // EV表示（pn × win_odds、参考値）。バックテストで買い目の根拠にはならないと
        // 確認済み（2026-07-05検証）。明らかなnon-value(EV<1.0)の除外用にのみ使う想定
        // なので、1.0以上を「買い信号」のように緑ハイライトしない（2026-07-24修正）。
        const evVal = h.ev;
        let valCell = '-';
        let valClass = 'val-none';
        if (evVal != null && evVal > 0) {
          valCell = evVal.toFixed(2);
          valClass = evVal >= 1.0 ? 'val-neutral' : 'val-over';
        }

        // 人気急上昇マーク
        let surgeBadge = '';
        if (h._odds_surge === 'hot') {
          surgeBadge = '<span style="color:#e74c3c;font-size:8px;font-weight:800;background:rgba(231,76,60,0.12);border-radius:3px;padding:0 3px;margin-left:2px" title="朝→直前でオッズ大幅下落">急騰</span>';
        } else if (h._odds_surge === 'warm') {
          surgeBadge = '<span style="color:#e67e22;font-size:8px;font-weight:700;margin-left:2px" title="朝→直前でオッズ下落傾向">上昇</span>';
        }

        // 乖離バッジ: RL順位 vs 人気順位
        let gapBadge = '';
        const rlNum = (h.rl_rank && h.rl_rank < 99) ? h.rl_rank : null;
        const popNum = h.pop != null ? h.pop : null;
        if (rlNum != null && popNum != null) {
          const gap = popNum - rlNum;
          const mPop = h._morning_pop;
          if (gap >= 2) {
            let title = 'AI' + rlNum + '位 vs 人気' + popNum + '位';
            let extra = '';
            if (mPop != null && mPop !== popNum) {
              const mGap = mPop - rlNum;
              if (mGap > gap) extra = '<span class="gap-converge" title="市場がAIに接近">←' + mGap + '</span>';
            }
            gapBadge = '<span class="gap-up" title="' + title + '">↑' + gap + '</span>' + extra;
          } else if (gap <= -2) {
            gapBadge = '<span class="gap-down" title="AI' + rlNum + '位 vs 人気' + popNum + '位">↓' + Math.abs(gap) + '</span>';
          }
        }

        // 人気×RL乖離マトリクスのセル実績バッジ:
        // 💎 = 実測回収率120%以上のセル（買い目候補が拡張される）
        // ▽ = 実測回収率50%未満のセル（単勝・複勝候補から除外される）
        let mxBadge = '';
        if (h.mx_flag === 'boost') {
          mxBadge = '<span style="font-size:8px;margin-left:1px" title="人気×AI順位の実績マトリクスで回収率120%以上のセル（買い目候補を拡張）">💎</span>';
        } else if (h.mx_flag === 'suppress') {
          mxBadge = '<span style="color:#bbb;font-size:8px;margin-left:1px" title="人気×AI順位の実績マトリクスで回収率50%未満のセル（単勝・複勝候補から除外）">▽</span>';
        }

        // AI評価内訳バッジ: ability_breakdown（SHAP寄与度分解）が使えるレース
        // （残差学習モデル運用時のみ）で、「AIが市場と違う評価をした理由」を
        // 上位の＋要因・－要因としてtitleツールチップに表示する
        let breakdownBadge = '';
        if (h.ability_breakdown && h.ability_breakdown.length > 0) {
          const pos = h.ability_breakdown.filter(b => b.contrib > 0.005).slice(0, 2);
          const neg = h.ability_breakdown.filter(b => b.contrib < -0.005).slice(-2).reverse();
          const parts = pos.map(b => b.category + '+' + b.contrib.toFixed(2))
            .concat(neg.map(b => b.category + b.contrib.toFixed(2)));
          if (parts.length > 0) {
            const title = ('AI評価の内訳: ' + parts.join(' / ')).replace(/"/g, '&quot;');
            breakdownBadge = '<span class="ability-badge" title="' + title + '">📊</span>';
          }
        }

        // AI単セル（市場を土台から外したAI単独順位）。RLと大きくズレる馬は
        // 「市場の評価に引っ張られてRLが動いた馬」なので、差だけ小さく添える。
        let _soloTd = '';
        if (_hasSolo) {
          const s = h.solo_rank;
          let cell = '-';
          if (s != null) {
            cell = String(s);
            if (rlNum != null) {
              const d = rlNum - s;   // 正 = 市場を外すとAIはもっと高く買う
              if (d >= 3)      cell += '<span style="color:#8e44ad;font-size:9px" title="市場を外すとAIはこの馬をさらに上位に見る">↑'+d+'</span>';
              else if (d <= -3) cell += '<span style="color:#95a5a6;font-size:9px" title="RLの評価は市場に支えられている（AI単独ではもっと下）">↓'+Math.abs(d)+'</span>';
            }
          }
          _soloTd = '<td class="col-rl" style="color:#666">'+cell+'</td>';
        }

        const _um = getUserMark(_umRid, h.n);
        const _umCell = '<td class="col-um"><span class="umark'+(_um?' umark-on':'')
          + '" data-rid="'+_umRid+'" onclick="cycleUserMark(\''+_umRid+'\','+h.n+',this)">'
          + _um + '</span></td>';
        html += '<tr'+(isH?' class="hl"':'')+'>'+_umCell+'<td>'+(isH?'◎':'')+h.n+'</td><td class="col-name">'+h.name+surgeBadge+'</td><td class="col-pop">'+pop+'</td><td class="col-odds">'+odds+'</td><td>'+mkBadge(h.mark)+'</td><td class="col-rl">'+rl+gapBadge+mxBadge+breakdownBadge+'</td>'+_soloTd+'<td>'+tan+'</td><td class="'+(hi?'phi':'plo')+'">'+fuku+'</td><td class="'+valClass+'">'+valCell+'</td></tr>';
      }
      html += '</table>';
      if (race.race_id) {
        html += '<div style="padding:6px 14px;text-align:center">';
        html += '<button class="odds-btn" onclick="fetchFreshOdds(\''+k+'\', this)">🔄 直前オッズ取得</button>';
        html += '<button class="pad-btn" onclick="openPaddockEditor(\''+k+'\')">🐎 パドック</button>';
        html += '<button class="note-btn" onclick="openNoteEditor(\''+k+'\')">📝 不利メモ</button>';
        html += '<button class="umark-clear" onclick="clearUserMarks(\''+_umRid+'\')">印クリア</button>';
        html += '<span class="odds-time" id="odds-time-'+k+'">'+(race._update_time ? ('更新: '+race._update_time) : '')+'</span>';
        html += '</div>';
      }
      const hasGumbel = (race.gumbel_bets||[]).length > 0;
      html += '<div class="bets">';
      if (!hasGumbel) {
        html += '<div class="sec" style="margin-top:12px">買い目</div>';
        if (race._morning_bets && race._morning_bets.length > 0) {
          html += '<div style="padding:4px 0;font-size:10px;color:#999">📋 朝の推奨: '
                + race._morning_bets.map(b=>(b.label||b.type)+' '+extractNums(b).map(n=>'#'+n).join('×')).join(' + ') + '</div>';
        }
        if (race._update_time) {
          html += '<div style="padding:4px 0;font-size:11px">🔄 直前更新 '+race._update_time+' ';
          switch (race._change_type) {
            case 'no_change':
              html += '<span style="color:#27ae60;font-weight:700">推奨変更なし</span>';

              html += buildValueChangeDetail(race);

          }
          html += '</div>';
        }
        for (const b of (race.bets||[])) {
          const tc = b.tag || TAG_MAP[b.label] || 'fuku';
          if (tc === 'sanfuku' && b.nums) {

            html += '<div style="margin:6px 0;padding:8px 10px;background:rgba(26,92,58,0.06);border-radius:6px;font-size:12px">';
            html += '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">';
            html += '<span class="btype sanfuku">'+b.label+'</span>';
            html += '<span class="bamt" style="margin-left:auto">'+b.amt+'</span>';
            html += '</div>';
            if (ttype === 'box') {
              html += '<div style="margin-top:5px;display:flex;align-items:center;gap:4px;flex-wrap:wrap">';
              html += '<span style="font-size:11px;color:#555;font-weight:600">BOX</span>';
              for (const n of b.nums) { html += '<span style="'+chipStyle+'">'+n+'</span>'; }
              html += '</div>';
            } else if (ttype === 'formation' && legs.length === 3) {
              for (let i = 0; i < 3; i++) {
                html += '<div style="margin-top:'+(i===0?'5':'2')+'px;display:flex;align-items:center;gap:4px;flex-wrap:wrap">';
                html += '<span style="'+legLabel+'">'+(i===0?'軸':'相手')+'</span>';
                for (const n of legs[i]) { html += '<span style="'+chipStyle+'">'+n+'</span>'; }
                html += '</div>';
              }
            } else {
              html += '<div style="margin-top:5px;display:flex;flex-wrap:wrap;gap:3px">';
              for (const c of combos) {
                html += '<span style="background:#fff;border:1px solid #ddd;border-radius:3px;padding:1px 5px;font-size:10px;font-weight:600;white-space:nowrap">'+c+'</span>';
              }
              html += '</div>';
            }
            html += '<div style="margin-top:4px;font-size:11px;color:#666">'+b.est+'</div>';
            html += '</div>';
          } else {
            html += '<div class="bet"><span class="btype '+tc+'">'+b.label+'</span><span class="bhorse">'+b.horse+'</span><span class="best">'+b.est+'</span><span class="bamt">'+b.amt+'</span></div>';
          }
        }
        if ((race.bets||[]).length === 0 && race._update_time) {
          html += '<div style="padding:6px 0;font-size:11px;color:#999">このレースは見送り</div>';
        }
      }
      if (hasGumbel) {
        html += '<div class="sec" style="margin-top:12px;font-size:11px;color:#117a65">🎯 軸1頭ベース買い目';
        // 直前オッズを取得しても買い目は作り直さない（サーバの結果を保つ）。
        // 上の馬表のオッズ・勝率だけが新しくなるので、そのズレを明示する。
        if (race._odds_refreshed) {
          html += ' <span style="font-size:10px;color:#888;font-weight:400" '
                + 'title="買い目は予想生成時点のまま固定です。上の馬表のオッズ・勝率は直前オッズで更新されています。">'

        html += '</div>';
        // ⚠ 実配当401レースの検証で回収率は控除率を超えていない
        //    （高配当1〜2本を除くと61〜87%）。期待値を盛った表示をしない。
        html += '<div style="margin:0 0 6px;font-size:10px;color:#8a6d3b;background:rgba(240,173,78,0.12);'
